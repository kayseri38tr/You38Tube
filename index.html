<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YouTune Türkiye - Video Platformu" />
    <title>YouTune Türkiye</title>
    <style>
      :root {
        --bg: #0f0f12;
        --surface: #18181c;
        --surface-hover: #222228;
        --surface-2: #282830;
        --line: rgba(255, 255, 255, 0.08);
        --text: #f3f3f5;
        --muted: #a0a0ab;
        --accent: #ff2a4b;
        --accent-glow: rgba(255, 42, 75, 0.4);
        --accent-soft: rgba(255, 42, 75, 0.15);
        --radius: 14px;
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      button, input { font: inherit; }
      button { cursor: pointer; border: none; background: none; }
      .app-shell { min-height: 100vh; padding-bottom: 90px; }

      header {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 64px;
        padding: 10px 24px;
        background: rgba(15, 15, 18, 0.9);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        font-weight: 800;
        color: #fff;
        cursor: pointer;
        user-select: none;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 22px;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font-size: 12px;
        box-shadow: 0 0 12px var(--accent-glow);
      }

      .search-form {
        display: flex;
        flex: 1;
        max-width: 600px;
      }
      .search-form input {
        width: 100%;
        height: 40px;
        padding: 0 16px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--line);
        border-right: none;
        border-radius: 20px 0 0 20px;
        outline: none;
      }
      .search-form input:focus {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.08);
      }
      .search-form button {
        width: 54px;
        border: 1px solid var(--line);
        border-radius: 0 20px 20px 0;
        background: var(--surface-2);
        color: var(--text);
        transition: var(--transition);
      }
      .search-form button:hover { background: var(--accent); }

      .header-action {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        color: var(--text);
        background: var(--surface);
      }

      main { width: min(1500px, calc(100% - 32px)); margin: 0 auto; padding-top: 20px; }
      
      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }
      h1 { margin: 0; font-size: clamp(22px, 2.5vw, 32px); font-weight: 800; }
      .hero p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
      .result-count { color: var(--muted); font-size: 13px; }

      .categories {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 16px;
        scrollbar-width: none;
      }
      .categories::-webkit-scrollbar { display: none; }
      .category {
        flex: 0 0 auto;
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: 20px;
        color: var(--text);
        background: var(--surface);
        font-size: 13px;
        font-weight: 500;
        transition: var(--transition);
      }
      .category:hover { background: var(--surface-hover); }
      .category.active {
        border-color: var(--accent);
        color: white;
        background: var(--accent);
      }

      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px 16px;
      }
      .video-card {
        min-width: 0;
        border-radius: var(--radius);
        cursor: pointer;
        transition: var(--transition);
        animation: fadeIn 0.3s ease;
      }
      .video-card:hover { transform: translateY(-4px); }

      .thumbnail-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: var(--radius);
        background: #1a1a1e;
      }
      .thumbnail-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .duration {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 3px 6px;
        border-radius: 4px;
        color: white;
        background: rgba(0, 0, 0, 0.8);
        font-size: 11px;
        font-weight: 600;
      }

      .play-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: white;
        background: rgba(0, 0, 0, 0.3);
        opacity: 0;
        transition: var(--transition);
        font-size: 32px;
      }
      .video-card:hover .play-overlay { opacity: 1; }

      .video-info { display: flex; gap: 10px; padding: 10px 2px 0; }
      .channel-avatar {
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #e11d48, #4f46e5);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
        color: #fff;
      }
      .video-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 0 0 4px;
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .video-meta { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; }

      .empty {
        display: none;
        padding: 60px 20px;
        color: var(--muted);
        text-align: center;
      }
      .empty strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 18px; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .bottom-nav {
        position: fixed;
        right: 0; bottom: 0; left: 0;
        z-index: 100;
        display: flex;
        justify-content: center;
        gap: 30px;
        padding: 8px 16px;
        background: rgba(24, 24, 28, 0.95);
        border-top: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .nav-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 6px 12px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 11px;
      }
      .nav-button span { font-size: 18px; }
      .nav-button:hover, .nav-button.active { color: var(--accent); }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.85);
      }
      .modal.open { display: flex; }
      .player-panel {
        width: min(900px, 100%);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      .player-top { display: flex; justify-content: flex-end; padding: 10px; }
      .close-button {
        width: 32px; height: 32px;
        border-radius: 50%;
        color: var(--text); background: var(--surface-2);
        font-size: 18px;
      }
      .player-frame { aspect-ratio: 16 / 9; background: #000; }
      .player-frame iframe { width: 100%; height: 100%; border: 0; }
      .player-details { padding: 16px 20px 20px; }
      .player-details h2 { margin: 0 0 6px; font-size: 18px; }
      .player-details p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
      .player-actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .player-actions button, .player-actions a {
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        color: var(--text);
        background: var(--surface-2);
        font-size: 13px;
        text-decoration: none;
      }
      .player-actions button:hover, .player-actions a:hover, .player-actions .selected {
        border-color: var(--accent);
        color: white;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div class="brand" id="brandBtn">
          <span class="brand-mark">▶</span>
          <span>YouTune</span>
        </div>
        <form class="search-form" id="searchForm" role="search">
          <input id="searchInput" type="search" placeholder="Video veya kanal ara..." aria-label="Video ara" />
          <button type="submit">🔍</button>
        </form>
        <button class="header-action" id="randomizeBtn" type="button" title="Videoları Karıştır">🎲</button>
      </header>

      <main>
        <section class="hero">
          <div>
            <h1 id="pageTitle">Ana Sayfa</h1>
            <p>Popüler Türkçe videoları keşfet ve izle.</p>
          </div>
          <div class="result-count" id="resultCount"></div>
        </section>

        <nav class="categories" id="categories"></nav>
        <section class="video-grid" id="videoGrid"></section>
        
        <section class="empty" id="emptyState">
          <strong>Sonuç Bulunamadı</strong>
          Farklı bir arama terimi deneyebilirsin.
        </section>
      </main>

      <nav class="bottom-nav">
        <button class="nav-button active" id="homeButton" type="button"><span>⌂</span>Ana Sayfa</button>
        <button class="nav-button" id="favoritesButton" type="button"><span>♡</span>Favoriler</button>
        <button class="nav-button" id="historyButton" type="button"><span>◷</span>Geçmiş</button>
      </nav>
    </div>

    <div class="modal" id="videoModal">
      <div class="player-panel">
        <div class="player-top">
          <button class="close-button" id="closeModal" type="button">✕</button>
        </div>
        <div class="player-frame" id="playerFrame"></div>
        <div class="player-details">
          <h2 id="playerTitle"></h2>
          <p id="playerMeta"></p>
          <div class="player-actions">
            <button id="favoriteButton" type="button">♡ Favorile</button>
            <button id="shareButton" type="button">↗ Paylaş</button>
            <a id="youtubeButton" target="_blank" rel="noopener noreferrer">YouTube'da Aç</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      // 100+ Video Veri Havuzu (Geçerli YouTube Video ID'leri)
      const baseVideos = [
        { id: "PPWl1FK2BRQ", title: "Çağla - Saz mı Caz mı?", channel: "netd müzik", views: "366 Mn", age: "8 yıl önce", duration: "3:26", category: "Müzik" },
        { id: "rNFsWlJm09k", title: "Yeni Çıkan Türkçe Şarkılar 2026", channel: "Adres Müzik", views: "150 B", age: "2 gün önce", duration: "8:34", category: "Müzik" },
        { id: "XZK42t0g3-c", title: "2000'ler Türkçe Pop Nostalji", channel: "Dj Burak", views: "4.2 Mn", age: "1 yıl önce", duration: "20:34", category: "Müzik" },
        { id: "3YqPKLZFPAY", title: "Tarkan - Geççek", channel: "Tarkan", views: "65 Mn", age: "2 yıl önce", duration: "3:54", category: "Müzik" },
        { id: "d9IxdwEFkLc", title: "EDIS - Martılar", channel: "EDIS", views: "120 Mn", age: "3 yıl önce", duration: "3:22", category: "Müzik" },
        { id: "LdghWhfJPUA", title: "1 Dolar vs 500.000 Dolarlık Deneyimler!", channel: "MrBeast Türkçe", views: "45 Mn", age: "1 yıl önce", duration: "17:34", category: "Eğlence" },
        { id: "EwJgpDYwFhk", title: "En Komik Video Derlemeleri #1", channel: "Çılgın Türkler", views: "77 B", age: "2 yıl önce", duration: "7:05", category: "Eğlence" },
        { id: "HZObP-SbHEM", title: "Blippi ile Dinozorları Keşfet!", channel: "Blippi Türkçe", views: "10 Mn", age: "3 yıl önce", duration: "7:03", category: "Eğitim" },
        { id: "35X2Km-5j00", title: "TCG Anadolu Neden Gri Renk Yapıldı?", channel: "GZT", views: "42 B", age: "2 gün önce", duration: "0:50", category: "Haber" },
        { id: "K_KpomHNcc0", title: "Türk-İsrail İlişkileri ve Küresel Analiz", channel: "İbrahim Halil", views: "52 B", age: "2 gün önce", duration: "1:09:12", category: "Haber" },
        { id: "F64PRO93e3w", title: "Son Dakika Siyaset ve Gündem Özel", channel: "TVNET", views: "749 B", age: "4 gün önce", duration: "0:42", category: "Haber" }
      ];

      // Veritabanını 100+ elemana dinamik olarak genişlet
      let videoDatabase = [];
      const topics = ["Rehberi", "Hakkında Bilinmeyenler", "Canlı Yayını", "En İyi Anlar", "Tepki Videosu", "Özel Derleme", "İncelemesi", "Özet", "Tüm Detaylar", "2026 Versiyonu"];
      
      let count = 0;
      while (videoDatabase.length < 100) {
        const sample = baseVideos[count % baseVideos.length];
        const topic = topics[Math.floor(count / baseVideos.length) % topics.length];
        videoDatabase.push({
          id: sample.id,
          title: `${sample.title} (${topic})`,
          channel: sample.channel,
          views: `${Math.floor(Math.random() * 800 + 10)} B`,
          age: sample.age,
          duration: sample.duration,
          category: sample.category,
          uid: sample.id + "_" + count
        });
        count++;
      }

      let currentVideos = [];
      let categories = [];
      let activeCategory = "Tümü";
      let activeVideo = null;
      let mode = "home";
      let searchTerm = "";

      const grid = document.querySelector("#videoGrid");
      const emptyState = document.querySelector("#emptyState");
      const resultCount = document.querySelector("#resultCount");
      const categoriesEl = document.querySelector("#categories");
      const searchInput = document.querySelector("#searchInput");
      const modal = document.querySelector("#videoModal");
      const playerFrame = document.querySelector("#playerFrame");
      const favoriteButton = document.querySelector("#favoriteButton");

      function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function getStored(key) {
        try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (_) { return []; }
      }
      function setStored(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
      }
      function isFavorite(id) { return getStored("youtune-favorites").includes(id); }

      // Türkçe Karakter Uyumlu Arama Fonksiyonu
      function normalizeText(text) {
        return text.toString()
          .replace(/İ/g, "i").replace(/I/g, "ı")
          .replace(/Ğ/g, "ğ").replace(/Ü/g, "ü")
          .replace(/Ş/g, "ş").replace(/Ö/g, "ö")
          .replace(/Ç/g, "ç").toLowerCase();
      }

      function getFilteredVideos() {
        const term = normalizeText(searchTerm.trim());
        return currentVideos.filter((video) => {
          const catMatch = activeCategory === "Tümü" || video.category === activeCategory;
          const fullText = normalizeText(`${video.title} ${video.channel} ${video.category}`);
          const searchMatch = !term || fullText.includes(term);
          
          let modeMatch = true;
          if (mode === "favorites") modeMatch = isFavorite(video.uid);
          if (mode === "history") modeMatch = getStored("youtune-history").includes(video.uid);

          return catMatch && searchMatch && modeMatch;
        });
      }

      function renderCategories() {
        categoriesEl.innerHTML = categories.map((cat) => `
          <button class="category ${activeCategory === cat ? "active" : ""}" type="button" data-category="${cat}">
            ${cat}
          </button>
        `).join("");
      }

      function renderVideos() {
        const list = getFilteredVideos();
        resultCount.textContent = `${list.length} video bulundu`;
        emptyState.style.display = list.length ? "none" : "block";

        grid.innerHTML = list.map((video) => {
          // Kesin yüklenen görsel mekanizması (Fallback ile)
          const imgUrl = `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;
          const avatarChar = video.channel.charAt(0).toUpperCase();

          return `
            <article class="video-card" tabindex="0" role="button" data-uid="${video.uid}">
              <div class="thumbnail-wrap">
                <img src="${imgUrl}" alt="${video.title}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${video.id}/0.jpg'" />
                <span class="play-overlay">▶</span>
                <span class="duration">${video.duration}</span>
              </div>
              <div class="video-info">
                <div class="channel-avatar">${avatarChar}</div>
                <div class="video-copy">
                  <h2 class="video-title">${video.title}</h2>
                  <p class="video-meta">${video.channel}<br>${video.views} izlenme • ${video.age}</p>
                </div>
              </div>
            </article>
          `;
        }).join("");
      }

      function openVideo(uid) {
        activeVideo = currentVideos.find((v) => v.uid === uid);
        if (!activeVideo) return;

        const history = getStored("youtune-history").filter((item) => item !== uid);
        setStored("youtune-history", [uid, ...history].slice(0, 50));

        document.querySelector("#playerTitle").textContent = activeVideo.title;
        document.querySelector("#playerMeta").textContent = `${activeVideo.channel} • ${activeVideo.views} • ${activeVideo.age}`;
        document.querySelector("#youtubeButton").href = `https://www.youtube.com/watch?v=${activeVideo.id}`;
        
        updateFavoriteBtn();

        playerFrame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${activeVideo.id}?autoplay=1&rel=0"
          title="${activeVideo.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        
        modal.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeVideo() {
        modal.classList.remove("open");
        playerFrame.innerHTML = "";
        document.body.style.overflow = "";
        activeVideo = null;
      }

      function updateFavoriteBtn() {
        if (!activeVideo) return;
        const fav = isFavorite(activeVideo.uid);
        favoriteButton.textContent = fav ? "♥ Favorilerden Çıkar" : "♡ Favorile";
        favoriteButton.classList.toggle("selected", fav);
      }

      function setMode(nextMode) {
        mode = nextMode;
        document.querySelectorAll(".nav-button").forEach((b) => b.classList.remove("active"));
        document.querySelector(`#${nextMode}Button`).classList.add("active");
        
        const titles = { home: "Ana Sayfa", favorites: "Favoriler", history: "Geçmiş" };
        document.querySelector("#pageTitle").textContent = titles[nextMode];
        renderVideos();
      }

      // Dinleyiciler
      document.querySelector("#searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        searchTerm = searchInput.value;
        mode = "home";
        document.querySelector("#pageTitle").textContent = searchTerm ? `"${searchTerm}" Sonuçları` : "Ana Sayfa";
        renderVideos();
      });

      categoriesEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-category]");
        if (!btn) return;
        activeCategory = btn.dataset.category;
        renderCategories();
        renderVideos();
      });

      grid.addEventListener("click", (e) => {
        const card = e.target.closest("[data-uid]");
        if (card) openVideo(card.dataset.uid);
      });

      document.querySelector("#closeModal").addEventListener("click", closeVideo);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeVideo(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("open")) closeVideo(); });

      favoriteButton.addEventListener("click", () => {
        if (!activeVideo) return;
        const favs = getStored("youtune-favorites");
        const next = isFavorite(activeVideo.uid) ? favs.filter((id) => id !== activeVideo.uid) : [activeVideo.uid, ...favs];
        setStored("youtune-favorites", next);
        updateFavoriteBtn();
        if (mode === "favorites") renderVideos();
      });

      document.querySelector("#shareButton").addEventListener("click", async () => {
        if (!activeVideo) return;
        const url = `https://www.youtube.com/watch?v=${activeVideo.id}`;
        if (navigator.share) await navigator.share({ title: activeVideo.title, url });
        else { await navigator.clipboard?.writeText(url); alert("YouTube bağlantısı kopyalandı."); }
      });

      document.querySelector("#homeButton").addEventListener("click", () => setMode("home"));
      document.querySelector("#favoritesButton").addEventListener("click", () => setMode("favorites"));
      document.querySelector("#historyButton").addEventListener("click", () => setMode("history"));

      document.querySelector("#randomizeBtn").addEventListener("click", () => {
        currentVideos = shuffle(videoDatabase);
        renderVideos();
      });

      document.querySelector("#brandBtn").addEventListener("click", () => {
        searchTerm = "";
        searchInput.value = "";
        activeCategory = "Tümü";
        currentVideos = shuffle(videoDatabase);
        renderCategories();
        setMode("home");
      });

      function init() {
        currentVideos = shuffle(videoDatabase);
        categories = ["Tümü", ...new Set(videoDatabase.map((v) => v.category))];
        renderCategories();
        renderVideos();
      }

      init();
    </script>
  </body>
</html>
