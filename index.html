<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YouTube videolarını aramak, listelemek ve sayfa içinde izlemek için tek dosyalık örnek." />
    <title>YouTune Türkiye</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --surface: #181818;
        --surface-2: #242424;
        --line: #303030;
        --text: #f1f1f1;
        --muted: #a9a9a9;
        --accent: #ff1932;
        --accent-soft: rgba(255, 25, 50, 0.16);
        --radius: 14px;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .app-shell { min-height: 100vh; padding-bottom: 82px; }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 24px;
        min-height: 64px;
        padding: 10px 28px;
        background: rgba(15, 15, 15, 0.94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: max-content;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 29px;
        height: 21px;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font-size: 13px;
      }
      .search-form {
        display: flex;
        flex: 1;
        max-width: 710px;
        margin: 0 auto;
      }
      .search-form input {
        width: 100%;
        height: 40px;
        padding: 0 16px;
        color: var(--text);
        background: #121212;
        border: 1px solid #3a3a3a;
        border-right: 0;
        border-radius: 22px 0 0 22px;
        outline: none;
      }
      .search-form input:focus { border-color: var(--accent); }
      .search-form button {
        width: 54px;
        border: 1px solid #3a3a3a;
        border-radius: 0 22px 22px 0;
        background: var(--surface-2);
        color: var(--text);
      }
      .search-form button:hover { color: var(--accent); }
      .header-action {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 50%;
        color: var(--text);
        background: transparent;
        font-size: 20px;
      }
      .header-action:hover { background: var(--surface-2); }

      main { width: min(1500px, calc(100% - 48px)); margin: 0 auto; padding-top: 26px; }
      .hero {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin: 0 0 24px;
      }
      h1 { margin: 0; font-size: clamp(26px, 3vw, 40px); letter-spacing: -1.4px; }
      .hero p { margin: 8px 0 0; color: var(--muted); }
      .result-count { color: var(--muted); font-size: 14px; white-space: nowrap; }
      .categories {
        display: flex;
        gap: 9px;
        overflow-x: auto;
        padding: 3px 0 22px;
        scrollbar-width: none;
      }
      .categories::-webkit-scrollbar { display: none; }
      .category {
        flex: 0 0 auto;
        padding: 9px 16px;
        border: 1px solid var(--line);
        border-radius: 20px;
        color: var(--text);
        background: var(--surface);
      }
      .category:hover, .category.active {
        border-color: var(--accent);
        color: white;
        background: var(--accent);
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 28px 18px;
      }
      .video-card {
        min-width: 0;
        border-radius: var(--radius);
        outline: none;
        transition: transform .2s ease;
      }
      .video-card:hover, .video-card:focus-visible { transform: translateY(-4px); }
      .thumbnail-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: var(--radius);
        background: #292929;
      }
      .thumbnail-wrap img { width: 100%; height: 100%; display: block; object-fit: cover; }
      .duration {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 3px 6px;
        border-radius: 4px;
        color: white;
        background: rgba(0, 0, 0, .85);
        font-size: 12px;
        font-weight: 700;
      }
      .play-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: white;
        background: rgba(0, 0, 0, .38);
        opacity: 0;
        transition: opacity .2s ease;
        font-size: 42px;
      }
      .video-card:hover .play-overlay, .video-card:focus-visible .play-overlay { opacity: 1; }
      .video-info { display: flex; gap: 11px; padding: 11px 2px 0; }
      .channel-avatar {
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: linear-gradient(135deg, #ef4444, #7f1d1d);
        font-weight: 800;
      }
      .video-copy { min-width: 0; }
      .video-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 0 0 5px;
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .video-meta { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
      .video-type {
        display: inline-block;
        margin-bottom: 5px;
        padding: 3px 7px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .playlist-save {
        margin-top: 8px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 16px;
        color: var(--text);
        background: var(--surface-2);
        font-size: 12px;
      }
      .playlist-save:hover, .playlist-save.saved {
        border-color: var(--accent);
        color: white;
        background: var(--accent-soft);
      }
      .collection-open {
        margin-top: 8px;
        padding: 6px 10px;
        border: 1px solid var(--accent);
        border-radius: 16px;
        color: white;
        background: var(--accent-soft);
        font-size: 12px;
      }
      .empty {
        display: none;
        padding: 90px 20px;
        color: var(--muted);
        text-align: center;
      }
      .empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 20px; }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        gap: 100px;
        min-height: 64px;
        padding: 8px;
        border-top: 1px solid var(--line);
        background: rgba(24, 24, 24, .96);
        backdrop-filter: blur(12px);
      }
      .nav-button {
        min-width: 90px;
        border: 0;
        color: var(--muted);
        background: transparent;
      }
      .nav-button span { display: block; margin-bottom: 2px; font-size: 20px; }
      .nav-button.active, .nav-button:hover { color: var(--accent); }

      .modal {
        position: relative;
        z-index: 1;
        display: none;
        margin: 0 0 28px;
      }
      .modal.open { display: flex; }
      .player-panel {
        width: min(980px, 100%);
        max-height: min(700px, calc(100vh - 105px));
        margin: 0 auto;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 20px 80px rgba(0, 0, 0, .55);
      }
      .player-top { display: flex; justify-content: end; padding: 8px 8px 0; }
      .close-button {
        width: 36px; height: 36px; border: 0; border-radius: 50%;
        color: var(--text); background: var(--surface-2); font-size: 20px;
      }
      .close-button:hover { background: var(--accent); }
      .player-frame { aspect-ratio: 16 / 9; background: #000; }
      .player-frame iframe { width: 100%; height: 100%; border: 0; }
      .player-details { padding: 18px 22px 24px; }
      .player-details h2 { margin: 0 0 9px; font-size: 21px; }
      .player-details p { margin: 0 0 17px; color: var(--muted); }
      .player-actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .player-actions button, .player-actions a {
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: 20px;
        color: var(--text);
        background: var(--surface-2);
        text-decoration: none;
      }
      .player-actions button:hover, .player-actions a:hover, .player-actions .selected {
        border-color: var(--accent);
        color: white;
        background: var(--accent-soft);
      }

      @media (max-width: 650px) {
        header { gap: 10px; padding: 9px 13px; }
        .brand { font-size: 16px; }
        .header-action { display: none; }
        main { width: min(100% - 26px, 1500px); padding-top: 20px; }
        .hero { display: block; }
        .result-count { display: block; margin-top: 12px; }
        .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 10px; }
        .video-info { gap: 7px; padding-top: 8px; }
        .channel-avatar { display: none; }
        .video-title { font-size: 13px; }
        .video-meta { font-size: 11px; }
        .bottom-nav {
          gap: 4px;
          justify-content: space-around;
          padding: 6px 4px;
        }
        .nav-button {
          min-width: 0;
          flex: 1 1 0;
          padding: 0 2px;
          font-size: 10px;
          line-height: 1.15;
          white-space: normal;
        }
        .nav-button span { font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div class="brand"><span class="brand-mark">▶</span><span>YouTune Türkiye</span></div>
        <form class="search-form" id="searchForm" role="search">
          <input id="searchInput" type="search" placeholder="Video, kanal veya konu ara..." aria-label="Video ara" />
          <button type="submit" aria-label="Ara">⌕</button>
        </form>
        <button class="header-action" type="button" aria-label="Bildirimler">♧</button>
      </header>

      <div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
        <div class="player-panel">
          <div class="player-top"><button class="close-button" id="closeModal" type="button" aria-label="Kapat">×</button></div>
          <div class="player-frame" id="playerFrame"></div>
          <div class="player-details">
            <h2 id="playerTitle"></h2>
            <p id="playerMeta"></p>
            <div class="player-actions">
              <button id="favoriteButton" type="button">♡ Favorile</button>
              <button id="shareButton" type="button">↗ Paylaş</button>
              <a id="youtubeButton" target="_blank" rel="noopener noreferrer">YouTube'da Aç</a>
            </div>
          </div>
        </div>
      </div>

      <main>
        <section class="hero">
          <div>
            <h1 id="pageTitle">Ana Sayfa</h1>
            <p>Türkçe videoları keşfet, ara ve sayfadan ayrılmadan izle.</p>
          </div>
          <div class="result-count" id="resultCount"></div>
        </section>

        <nav class="categories" id="categories" aria-label="Video kategorileri"></nav>
        <section class="video-grid" id="videoGrid" aria-live="polite"></section>
        <section class="empty" id="emptyState">
          <strong>Video bulunamadı</strong>
          Arama kelimesini veya kategori filtresini değiştirip tekrar deneyebilirsin.
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Alt menü">
        <button class="nav-button active" id="homeButton" type="button"><span>⌂</span>Ana Sayfa</button>
        <button class="nav-button" id="favoritesButton" type="button"><span>♡</span>Favoriler</button>
        <button class="nav-button" id="historyButton" type="button"><span>◷</span>Geçmiş</button>
        <button class="nav-button" id="playlistsButton" type="button"><span>▤</span>Kaydedilen oynatma listeleri</button>
      </nav>
    </div>

    <script>
      "use strict";

      // Arama servisleri: biri çalışmazsa sıradaki otomatik olarak denenir.
      const SEARCH_ENDPOINTS = [
        { type: "piped", url: "https://api.piped.private.coffee/search" },
        { type: "piped", url: "https://pipedapi.kavin.rocks/search" },
        { type: "invidious", url: "https://invidious.nerdvpn.de/api/v1/search" },
        { type: "invidious", url: "https://inv.tux.pizza/api/v1/search" }
      ];

      // Çerez Yardımcı Fonksiyonları (Siteniz için çerez yönetimi eklenmiştir)
      function setCookie(name, value, days) {
        let expires = "";
        if (days) {
          const date = new Date();
          date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
          expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
      }

      function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) === ' ') c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
      }

      // Proje videoları dizisi
      const videos = [
        { id: "rNFsWlJm09k", title: "Yeni Çıkan Türkçe Şarkılar | 22 Ağustos 2026", channel: "Adres Müzik", views: "4,8 B görüntüleme", age: "1 gün önce", duration: "8:34", category: "Müzik" },
        { id: "-FQ_-OMgzMY", title: "Yeni Çıkan Türkçe Şarkılar | 15 Ağustos 2026", channel: "Adres Müzik", views: "39 B görüntüleme", age: "8 gün önce", duration: "8:13", category: "Müzik" },
        { id: "HZObP-SbHEM", title: "Blippi ile Dinozorları Keşfet! | Blippi Türkçe", channel: "Blippi Türkçe", views: "10 Mn görüntüleme", age: "3 yıl önce", duration: "7:03", category: "Eğitim" },
        { id: "EwJgpDYwFhk", title: "En Komik Video Derlemeleri #1", channel: "Çılgın Türkler", views: "77 B görüntüleme", age: "2 yıl önce", duration: "7:05", category: "Komedi" },
        { id: "XZK42t0g3-c", title: "2000'ler Türkçe Pop | HD Video Klip", channel: "Dj Burak Kilincoglu", views: "4,2 Mn görüntüleme", age: "1 yıl önce", duration: "20:34", category: "Müzik" },
        { id: "PPWl1FK2BRQ", title: "Çağla - Saz mı Caz mı?", channel: "netd müzik", views: "366 Mn görüntüleme", age: "8 yıl önce", duration: "3:26", category: "Müzik" },
        { id: "35X2Km-5j00", title: "Mavi Vatan'ın renk sırrı: TCG Anadolu neden gri?", channel: "GZT", views: "42 B görüntüleme", age: "2 gün önce", duration: "0:50", category: "Haber" },
        { id: "K_KpomHNcc0", title: "Türk-İsrail Savaşında Kürtler Hangi Tarafta?", channel: "İbrahim Halil Baran", views: "52 B görüntüleme", age: "2 gün önce", duration: "1:09:12", category: "Haber" },
        { id: "F64PRO93e3w", title: "Darbe olacak sanıp cumhurbaşkanı Erdoğan'ı tehdit etmiş!", channel: "TVNET", views: "749 B görüntüleme", age: "4 gün önce", duration: "0:42", category: "Haber" },
        { id: "LdghWhfJPUA", title: "1 Dolar vs. 500.000 Dolarlık Deneyimler!", channel: "MrBeassttTurkiye", views: "13 B görüntüleme", age: "1 yıl önce", duration: "17:34", category: "Eğlence" }
      ];

      const categories = ["Tümü", ...new Set(videos.map((video) => video.category))];
      let activeCategory = "Tümü";
      let activeVideo = null;
      let mode = "home";
      let searchTerm = "";
      let remoteVideos = null;

      const grid = document.querySelector("#videoGrid");
      const emptyState = document.querySelector("#emptyState");
      const resultCount = document.querySelector("#resultCount");
      const categoriesEl = document.querySelector("#categories");
      const searchInput = document.querySelector("#searchInput");
      const modal = document.querySelector("#videoModal");
      const playerFrame = document.querySelector("#playerFrame");
      const favoriteButton = document.querySelector("#favoriteButton");

      function getStored(key) {
        try { return JSON.parse(localStorage.getItem(key) || "[]"); }
        catch (_) { return []; }
      }
      function setStored(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); }
        catch (_) { /* Tarayıcı depolaması kapalıysa uygulama çalışmaya devam eder */ }
      }
      function isFavorite(id) { return getStored("youtune-favorites").includes(id); }
      function isPlaylistSaved(id) { return getStored("youtune-playlists").some((playlist) => playlist.id === id); }

      function filteredVideos() {
        const term = searchTerm.trim().toLocaleLowerCase("tr-TR");
        const sourceVideos = mode === "savedPlaylists"
          ? getStored("youtune-playlists")
          : (remoteVideos || videos);
        return sourceVideos.filter((video) => {
          const categoryMatch = mode === "savedPlaylists" || activeCategory === "Tümü" || video.category === activeCategory;
          const text = `${video.title} ${video.channel} ${video.category}`.toLocaleLowerCase("tr-TR");
          const searchMatch = !term || text.includes(term);
          const modeMatch = mode === "home"
            || (mode === "favorites" && isFavorite(video.id))
            || (mode === "history" && getStored("youtune-history").includes(video.id))
            || mode === "savedPlaylists";
          return categoryMatch && searchMatch && modeMatch;
        });
      }

      function formatDuration(seconds) {
        if (!seconds || seconds < 0) return "";
        if (typeof seconds === "string") return seconds;
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds < 10 ? "0" : ""}${remainingSeconds}`;
      }

      function formatViews(views) {
        if (!views && views !== 0) return "";
        if (typeof views === "string") return views;
        if (views >= 1000000) return `${(views / 1000000).toFixed(1)} Mn görüntüleme`;
        if (views >= 1000) return `${(views / 1000).toFixed(0)} B görüntüleme`;
        return `${views} görüntüleme`;
      }

      async function fetchSearch(query) {
        let lastError;

        for (const endpoint of SEARCH_ENDPOINTS) {
          try {
            const allResults = [];
            const searchTypes = endpoint.type === "piped"
              ? [{ value: "all", pages: 1 }, { value: "videos", pages: 10 }, { value: "channels", pages: 1 }, { value: "playlists", pages: 1 }]
              : [{ value: "video", pages: 10 }, { value: "channel", pages: 1 }, { value: "playlist", pages: 1 }];

            for (const searchType of searchTypes) {
              let continuation = "";
              for (let page = 1; page <= searchType.pages; page++) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4500);
                const pageParam = endpoint.type === "piped"
                  ? (continuation ? `&continuation=${encodeURIComponent(continuation)}` : "")
                  : `&page=${page}`;
                const typeParam = endpoint.type === "piped" ? `filter=${searchType.value}` : `type=${searchType.value}`;
                const fetchUrl = `${endpoint.url}?q=${encodeURIComponent(query)}&${typeParam}${pageParam}`;

                try {
                  const response = await fetch(fetchUrl, { signal: controller.signal });
                  if (!response.ok) break;
                  const data = await response.json();
                  const rawItems = Array.isArray(data) ? data : (data.items || []);
                  if (!rawItems.length) break;

                  rawItems.forEach((item) => {
                    const itemType = item.type === "channel" ? "channel" : item.type === "playlist"
                      ? "playlist" : (searchType.value === "channel" ? "channel" : searchType.value === "playlist" ? "playlist" : "video");
                    let id = item.videoId || item.channelId || item.playlistId || "";
                    if (!id && item.url) {
                      const match = item.url.match(/\/(?:watch\?v=|playlist\?list=|channel\/)([^&]+)/);
                      id = match ? match[1] : "";
                    }
                    if (!id) return;
                    allResults.push({
                      id,
                      resultType: itemType,
                      title: item.title || item.name || "Başlıksız",
                      channel: item.uploaderName || item.author || item.owner || item.uploader || item.subscribers || "Kanal",
                      views: itemType === "video" ? formatViews(item.views ?? item.viewCount) : (item.videos ? `${item.videos} video` : ""),
                      age: item.uploadedDate || item.publishedText || "",
                      thumbnail: item.thumbnail || item.thumbnailUrl || item.avatarUrl || "",
                      duration: formatDuration(item.duration ?? item.lengthSeconds),
                      category: itemType === "playlist" ? "Oynatma Listesi" : itemType === "channel" ? "Kanal" : "Arama"
                    });
                  });

                  continuation = data.nextpage || data.continuation || "";
                  if (endpoint.type === "piped" && (!continuation || searchType.pages === 1)) break;
                } catch (error) {
                  lastError = error;
                  break;
                } finally {
                  clearTimeout(timeoutId);
                }
              }
            }

            const uniqueResults = allResults.filter((item, index, list) =>
              list.findIndex((other) => `${other.resultType}:${other.id}` === `${item.resultType}:${item.id}`) === index
            );
            if (uniqueResults.length) return uniqueResults;
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError || new Error("Arama sunucularına şu an erişilemiyor.");
      }

      function renderCategories() {
        categoriesEl.innerHTML = categories.map((category) => `
          <button class="category ${activeCategory === category ? "active" : ""}" type="button" data-category="${category}">
            ${category}
          </button>
        `).join("");
      }

      function renderVideos() {
        const visibleVideos = filteredVideos();
        resultCount.textContent = `${visibleVideos.length} ${mode === "savedPlaylists" ? "oynatma listesi" : "sonuç"}`;
        emptyState.style.display = visibleVideos.length ? "none" : "block";
        if (!visibleVideos.length && mode === "savedPlaylists") {
          emptyState.innerHTML = "<strong>Henüz oynatma listesi kaydetmedin</strong>Arama sonuçlarından istediğin oynatma listesini kaydedebilirsin.";
        }
        grid.innerHTML = visibleVideos.map((video) => `
          <article class="video-card" tabindex="${video.resultType === "video" || !video.resultType ? "0" : "-1"}" role="${video.resultType === "video" || !video.resultType ? "button" : "article"}" data-video-id="${video.id}" data-result-type="${video.resultType || "video"}" aria-label="${video.title}">
            <div class="thumbnail-wrap">
              <img src="${video.resultType === "channel" ? (video.thumbnail || "") : video.resultType === "playlist" ? (video.thumbnail || `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`) : `https://i.ytimg.com/vi/${video.id}/hq720.jpg`}" alt="" loading="lazy"
                onerror="this.src='https://i.ytimg.com/vi/${video.id}/hqdefault.jpg'" />
              ${video.resultType === "video" || !video.resultType ? '<span class="play-overlay">▶</span>' : ""}
              ${video.duration ? `<span class="duration">${video.duration}</span>` : ""}
            </div>
            <div class="video-info">
              <div class="channel-avatar">${video.channel.charAt(0)}</div>
              <div class="video-copy">
                ${video.resultType && video.resultType !== "video" ? `<span class="video-type">${video.resultType === "playlist" ? "Oynatma listesi" : "Kanal"}</span>` : ""}
                <h2 class="video-title">${video.title}</h2>
                <p class="video-meta">${video.channel}<br>${video.views} • ${video.age}</p>
                ${video.resultType === "channel" ? `<button class="collection-open" type="button" data-collection-id="${video.id}" data-collection-type="channel" data-collection-title="${video.title}">Videolarını göster</button>` : ""}
                ${video.resultType === "playlist" ? `<button class="playlist-save ${isPlaylistSaved(video.id) ? "saved" : ""}" type="button" data-playlist-id="${video.id}">${isPlaylistSaved(video.id) ? "✓ Kaydedildi" : "＋ Oynatma listesini kaydet"}</button>` : ""}
                ${video.resultType === "playlist" ? `<button class="collection-open" type="button" data-collection-id="${video.id}" data-collection-type="playlist" data-collection-title="${video.title}">Liste videolarını göster</button>` : ""}
              </div>
            </div>
          </article>
        `).join("");
      }

      function openVideo(id) {
        activeVideo = (remoteVideos || videos).find((video) => video.id === id);
        if (!activeVideo || (activeVideo.resultType && activeVideo.resultType !== "video")) return;
        const history = getStored("youtune-history").filter((item) => item !== id);
        setStored("youtune-history", [id, ...history].slice(0, 30));
        
        // İzlenen son videoyu Cookie olarak kaydeder
        setCookie("last_watched_video", id, 30);

        document.querySelector("#playerTitle").textContent = activeVideo.title;
        document.querySelector("#playerMeta").textContent = `${activeVideo.channel} • ${activeVideo.views} • ${activeVideo.age}`;
        document.querySelector("#youtubeButton").href = `https://www.youtube.com/watch?v=${id}`;
        favoriteButton.textContent = isFavorite(id) ? "♥ Favorilerden çıkar" : "♡ Favorile";
        favoriteButton.classList.toggle("selected", isFavorite(id));
        
        // Gizlilik modlu resmi YouTube Player (No-Cookie Alan Adı)
        playerFrame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0"
          title="${activeVideo.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        modal.classList.add("open");
      }

      function closeVideo() {
        modal.classList.remove("open");
        playerFrame.innerHTML = "";
        activeVideo = null;
      }

      function savePlaylist(id) {
        const playlist = (remoteVideos || videos).find((item) => item.id === id && item.resultType === "playlist");
        if (!playlist) return;
        const saved = getStored("youtune-playlists");
        if (isPlaylistSaved(id)) {
          setStored("youtune-playlists", saved.filter((item) => item.id !== id));
        } else {
          setStored("youtune-playlists", [playlist, ...saved]);
        }
        renderVideos();
      }

      async function openCollection(id, type, title) {
        const baseUrl = "https://api.piped.private.coffee";
        const detailPath = type === "playlist" ? `/playlists/${id}` : `/channel/${id}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 7000);
        const buttonText = type === "playlist" ? "Oynatma listesi" : "Kanal";

        resultCount.textContent = `${buttonText} yükleniyor...`;
        emptyState.innerHTML = `<strong>${buttonText} yükleniyor...</strong>Videolar getiriliyor.`;
        emptyState.style.display = "block";

        try {
          const response = await fetch(`${baseUrl}${detailPath}`, { signal: controller.signal });
          const data = response.ok ? await response.json() : {};
          let collectionVideos = (data.relatedStreams || data.items || [])
            .filter((item) => item.type === "stream" || item.videoId || item.url)
            .map((item) => {
              const match = (item.url || "").match(/[?&]v=([^&]+)/);
              return {
                id: item.videoId || (match ? match[1] : ""),
                resultType: "video",
                title: item.title || "Başlıksız",
                channel: item.uploaderName || item.author || title,
                views: formatViews(item.views ?? item.viewCount),
                age: item.uploadedDate || item.publishedText || "",
                thumbnail: item.thumbnail || "",
                duration: formatDuration(item.duration ?? item.lengthSeconds),
                category: "Arama"
              };
            })
            .filter((item) => item.id);

          // Bazı sunucular koleksiyon ayrıntısını vermediğinde başlıkla güvenli arama yapılır.
          if (!collectionVideos.length) {
            collectionVideos = (await fetchSearch(title)).filter((item) => item.resultType === "video");
          }
          if (!collectionVideos.length) throw new Error("Bu koleksiyonda gösterilecek video bulunamadı.");

          remoteVideos = collectionVideos;
          searchTerm = "";
          activeCategory = "Tümü";
          mode = "home";
          document.querySelector("#pageTitle").textContent = `"${title}" videoları`;
          renderCategories();
          renderVideos();
        } catch (error) {
          emptyState.innerHTML = `<strong>${buttonText} açılamadı</strong>${error.message || "Lütfen tekrar deneyin."}`;
          emptyState.style.display = "block";
          resultCount.textContent = "İçerik alınamadı";
        } finally {
          clearTimeout(timeoutId);
        }
      }

      function setMode(nextMode) {
        mode = nextMode;
        if (nextMode !== "home") {
          remoteVideos = null;
          searchTerm = "";
        }
        document.querySelectorAll(".nav-button").forEach((button) => button.classList.remove("active"));
        document.querySelector(`#${nextMode === "home" ? "homeButton" : nextMode === "favorites" ? "favoritesButton" : nextMode === "history" ? "historyButton" : "playlistsButton"}`).classList.add("active");
        document.querySelector("#pageTitle").textContent = nextMode === "home" ? "Ana Sayfa" : nextMode === "favorites" ? "Favoriler" : nextMode === "history" ? "Geçmiş" : "Kaydedilen oynatma listeleri";
        renderVideos();
      }

      document.querySelector("#searchForm").addEventListener("submit", async (event) => {
        event.preventDefault();
         const query = searchInput.value.trim();
         const submitButton = event.currentTarget.querySelector("button");

         if (query.length < 2) {
           remoteVideos = null;
           searchTerm = "";
           mode = "home";
           document.querySelector("#pageTitle").textContent = "Ana Sayfa";
           renderVideos();
           return;
         }

         submitButton.disabled = true;
         resultCount.textContent = "Aranıyor...";
         emptyState.innerHTML = "<strong>Aranıyor...</strong>YouTube üzerinden sonuçlar getiriliyor.";
         emptyState.style.display = "block";

         try {
           const results = await fetchSearch(query);
           remoteVideos = results;
           searchTerm = "";
           activeCategory = "Tümü";
           mode = "home";
           document.querySelector("#pageTitle").textContent = `"${query}" sonuçları`;
           renderCategories();
           renderVideos();
         } catch (error) {
           remoteVideos = null;
           resultCount.textContent = "Arama başarısız";
           emptyState.innerHTML = `<strong>Arama yapılamadı</strong>${error.message || "Lütfen tekrar deneyin."}`;
           emptyState.style.display = "block";
         } finally {
           submitButton.disabled = false;
         }
      });
      categoriesEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        renderCategories();
        renderVideos();
      });
      grid.addEventListener("click", (event) => {
         const collectionButton = event.target.closest("[data-collection-id]");
         if (collectionButton) {
           event.preventDefault();
           event.stopPropagation();
           openCollection(collectionButton.dataset.collectionId, collectionButton.dataset.collectionType, collectionButton.dataset.collectionTitle);
           return;
         }
         const playlistButton = event.target.closest("[data-playlist-id]");
         if (playlistButton) {
           event.preventDefault();
           event.stopPropagation();
           savePlaylist(playlistButton.dataset.playlistId);
           return;
         }
        const card = event.target.closest("[data-video-id]");
         if (card && card.dataset.resultType === "video") openVideo(card.dataset.videoId);
      });
      grid.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-video-id]");
         if (card && card.dataset.resultType === "video") { event.preventDefault(); openVideo(card.dataset.videoId); }
      });
      document.querySelector("#closeModal").addEventListener("click", closeVideo);
      modal.addEventListener("click", (event) => { if (event.target === modal) closeVideo(); });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape" && modal.classList.contains("open")) closeVideo(); });
      favoriteButton.addEventListener("click", () => {
        if (!activeVideo) return;
        const favorites = getStored("youtune-favorites");
        const next = isFavorite(activeVideo.id) ? favorites.filter((id) => id !== activeVideo.id) : [activeVideo.id, ...favorites];
        setStored("youtune-favorites", next);
        favoriteButton.textContent = isFavorite(activeVideo.id) ? "♥ Favorilerden çıkar" : "♡ Favorile";
        favoriteButton.classList.toggle("selected", isFavorite(activeVideo.id));
        if (mode === "favorites") renderVideos();
      });
      document.querySelector("#shareButton").addEventListener("click", async () => {
        if (!activeVideo) return;
        const url = `https://www.youtube.com/watch?v=${activeVideo.id}`;
        if (navigator.share) await navigator.share({ title: activeVideo.title, url });
        else { await navigator.clipboard?.writeText(url); alert("YouTube bağlantısı kopyalandı."); }
      });
      document.querySelector("#homeButton").addEventListener("click", () => setMode("home"));
      document.querySelector("#favoritesButton").addEventListener("click", () => setMode("favorites"));
      document.querySelector("#historyButton").addEventListener("click", () => setMode("history"));
       document.querySelector("#playlistsButton").addEventListener("click", () => setMode("savedPlaylists"));

      renderCategories();
      renderVideos();
    </script>
  </body>
</html>
