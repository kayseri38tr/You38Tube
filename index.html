<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="YouTune Türkiye - Türkçe videoları keşfet, ara ve izle."
    />
    <title>YouTune Türkiye</title>
    <style>
      :root {
        --bg: #0b0c10;
        --surface: #15171d;
        --surface-2: #20232b;
        --surface-3: #2a2e38;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f5f6fa;
        --muted: #a4a8b4;
        --accent: #ff2d55;
        --accent-2: #ff6b35;
        --accent-soft: rgba(255, 45, 85, 0.14);
        --success: #77e0ba;
        --radius: 16px;
        --shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
        --ease: 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 82% -10%, rgba(255, 45, 85, 0.1), transparent 33rem),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      .video-card:focus-visible {
        outline: 3px solid rgba(255, 107, 53, 0.85);
        outline-offset: 3px;
      }

      .app-shell {
        min-height: 100vh;
        padding-bottom: 92px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 24px;
        min-height: 68px;
        padding: 12px clamp(16px, 3vw, 42px);
        border-bottom: 1px solid var(--line);
        background: rgba(11, 12, 16, 0.88);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.03em;
        user-select: none;
      }

      .brand-button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 0;
        color: inherit;
        background: transparent;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 24px;
        place-items: center;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 7px 22px rgba(255, 45, 85, 0.28);
        color: #fff;
        font-size: 13px;
      }

      .search-form {
        display: flex;
        flex: 1 1 620px;
        max-width: 680px;
        margin: 0 auto;
      }

      .search-input {
        min-width: 0;
        width: 100%;
        height: 42px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-right: 0;
        border-radius: 22px 0 0 22px;
        outline: none;
        background: rgba(255, 255, 255, 0.055);
        color: var(--text);
        transition: var(--ease);
      }

      .search-input::placeholder {
        color: #7d818c;
      }

      .search-input:focus {
        border-color: rgba(255, 45, 85, 0.8);
        background: rgba(255, 255, 255, 0.08);
      }

      .search-button {
        width: 58px;
        border: 1px solid var(--line);
        border-radius: 0 22px 22px 0;
        background: var(--surface-2);
        color: #fff;
        transition: var(--ease);
      }

      .search-button:hover {
        background: var(--accent);
      }

      .random-button {
        display: grid;
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
        color: var(--text);
        font-size: 18px;
        transition: var(--ease);
      }

      .random-button:hover {
        border-color: var(--accent);
        color: #fff;
        transform: rotate(12deg);
      }

      main {
        width: min(1500px, calc(100% - 32px));
        margin: 0 auto;
        padding: 30px 0 8px;
      }

      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 3vw, 38px);
        letter-spacing: -0.045em;
        line-height: 1.1;
      }

      .page-description {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .result-count {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      .categories {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin-bottom: 24px;
        padding: 2px 0 6px;
        scrollbar-width: none;
      }

      .categories::-webkit-scrollbar {
        display: none;
      }

      .category {
        flex: 0 0 auto;
        padding: 9px 17px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        transition: var(--ease);
      }

      .category:hover {
        border-color: rgba(255, 255, 255, 0.24);
        background: var(--surface-2);
      }

      .category.active {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent), #ff476f);
        color: #fff;
        box-shadow: 0 8px 22px rgba(255, 45, 85, 0.22);
      }

      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 28px 16px;
      }

      .video-card {
        min-width: 0;
        border-radius: var(--radius);
        cursor: pointer;
        animation: appear 350ms both;
        transition: transform var(--ease);
      }

      .video-card:hover {
        transform: translateY(-5px);
      }

      .thumbnail-wrap {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        border-radius: var(--radius);
        background: #242731;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }

      .thumbnail {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 400ms ease, filter 400ms ease;
      }

      .video-card:hover .thumbnail {
        filter: brightness(0.82);
        transform: scale(1.035);
      }

      .play-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.22);
        color: #fff;
        font-size: 32px;
        opacity: 0;
        transition: var(--ease);
      }

      .video-card:hover .play-overlay,
      .video-card:focus-visible .play-overlay {
        opacity: 1;
      }

      .duration {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 4px 6px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.84);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }

      .video-info {
        display: flex;
        gap: 11px;
        padding: 11px 2px 0;
      }

      .channel-avatar {
        display: grid;
        flex: 0 0 38px;
        width: 38px;
        height: 38px;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        background: var(--avatar-bg, linear-gradient(135deg, #ed3c72, #6648d8));
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .channel-avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .video-copy {
        min-width: 0;
      }

      .video-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 0 0 5px;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.36;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .video-meta {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.48;
      }

      .empty-state {
        display: none;
        max-width: 520px;
        margin: 40px auto 0;
        padding: 42px 22px;
        border: 1px dashed rgba(255, 255, 255, 0.17);
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 7px;
        color: var(--text);
        font-size: 18px;
      }

      .empty-state button {
        margin-top: 17px;
        padding: 9px 15px;
        border-radius: 20px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
      }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        gap: 28px;
        min-height: 70px;
        padding: 8px 16px;
        border-top: 1px solid var(--line);
        background: rgba(21, 23, 29, 0.9);
        backdrop-filter: blur(18px);
      }

      .nav-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        min-width: 74px;
        padding: 5px 12px;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        transition: var(--ease);
      }

      .nav-icon {
        font-size: 21px;
        line-height: 1;
      }

      .nav-button:hover,
      .nav-button.active {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(5px);
      }

      .modal.open {
        display: flex;
      }

      .player-panel {
        width: min(920px, 100%);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
        animation: modal-in 220ms ease-out;
      }

      .player-top {
        display: flex;
        justify-content: flex-end;
        padding: 10px;
      }

      .close-button {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        background: var(--surface-2);
        color: var(--text);
        font-size: 17px;
      }

      .close-button:hover {
        background: var(--accent);
      }

      .player-frame {
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .player-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .player-details {
        padding: 18px 22px 24px;
      }

      .player-details h2 {
        margin: 0 0 7px;
        font-size: 20px;
        line-height: 1.25;
      }

      .player-details p {
        margin: 0 0 17px;
        color: var(--muted);
        font-size: 13px;
      }

      .player-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .player-actions button,
      .player-actions a {
        padding: 9px 15px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 13px;
        text-decoration: none;
        transition: var(--ease);
      }

      .player-actions button:hover,
      .player-actions a:hover,
      .player-actions .selected {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 88px;
        z-index: 40;
        max-width: min(340px, calc(100vw - 36px));
        padding: 12px 15px;
        border: 1px solid rgba(119, 224, 186, 0.35);
        border-radius: 12px;
        background: #172a26;
        color: var(--success);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(12px);
        transition: var(--ease);
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes modal-in {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 620px) {
        .topbar {
          flex-wrap: wrap;
          gap: 11px;
          padding-top: 10px;
          padding-bottom: 10px;
        }

        .brand {
          flex: 1 1 auto;
        }

        .search-form {
          order: 3;
          flex-basis: 100%;
        }

        .random-button {
          width: 36px;
          height: 36px;
        }

        main {
          width: min(100% - 24px, 500px);
          padding-top: 24px;
        }

        .page-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
          margin-bottom: 17px;
        }

        .result-count {
          text-align: left;
        }

        .video-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 22px 10px;
        }

        .video-info {
          gap: 7px;
        }

        .channel-avatar {
          flex-basis: 32px;
          width: 32px;
          height: 32px;
          font-size: 10px;
        }

        .video-title {
          font-size: 12px;
        }

        .video-meta {
          font-size: 10px;
        }

        .bottom-nav {
          gap: 8px;
        }
      }

      @media (max-width: 390px) {
        .video-grid {
          grid-template-columns: 1fr;
        }

        .video-title {
          font-size: 14px;
        }

        .video-meta {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand-button" id="brandButton" type="button" aria-label="Ana sayfaya dön">
          <span class="brand-mark">▶</span>
          <span class="brand">YouTune</span>
        </button>

        <form class="search-form" id="searchForm" role="search">
          <input
            class="search-input"
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Video veya kanal ara..."
            aria-label="Video veya kanal ara"
          />
          <button class="search-button" type="submit" aria-label="Ara">⌕</button>
        </form>

        <button class="random-button" id="randomButton" type="button" title="Videoları karıştır">
          ⤨
        </button>
      </header>

      <main>
        <section class="page-heading">
          <div>
            <h1 id="pageTitle">Ana Sayfa</h1>
            <p class="page-description">Popüler Türkçe videoları keşfet ve izle.</p>
          </div>
          <div class="result-count" id="resultCount" aria-live="polite"></div>
        </section>

        <nav class="categories" id="categories" aria-label="Video kategorileri"></nav>
        <section class="video-grid" id="videoGrid" aria-live="polite"></section>

        <section class="empty-state" id="emptyState">
          <strong>Sonuç bulunamadı</strong>
          <span>Başka bir kelime veya kategori deneyin.</span>
          <br />
          <button id="clearSearchButton" type="button">Aramayı temizle</button>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Ana menü">
        <button class="nav-button active" id="homeButton" type="button">
          <span class="nav-icon">⌂</span>
          Ana Sayfa
        </button>
        <button class="nav-button" id="favoritesButton" type="button">
          <span class="nav-icon">♡</span>
          Favoriler
        </button>
        <button class="nav-button" id="historyButton" type="button">
          <span class="nav-icon">◷</span>
          Geçmiş
        </button>
      </nav>
    </div>

    <div class="modal" id="videoModal" aria-hidden="true">
      <div class="player-panel" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
        <div class="player-top">

            ×
          </button>
        </div>
        <div class="player-frame" id="playerFrame"></div>
        <div class="player-details">
          <h2 id="playerTitle"></h2>
          <p id="playerMeta"></p>
          <div class="player-actions">

            <button id="shareButton" type="button">↗ Paylaş</button>
            <a id="youtubeButton" target="_blank" rel="noopener noreferrer">YouTube'da aç</a>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

      };

      const state = {
        mode: "home",
        activeCategory: "Tümü",
        searchTerm: "",
        visibleVideos: [...videos],
        activeVideo: null,
      };

      const elements = {
        grid: document.querySelector("#videoGrid"),
        emptyState: document.querySelector("#emptyState"),
        resultCount: document.querySelector("#resultCount"),
        categories: document.querySelector("#categories"),
        searchForm: document.querySelector("#searchForm"),
        searchInput: document.querySelector("#searchInput"),
        pageTitle: document.querySelector("#pageTitle"),
        modal: document.querySelector("#videoModal"),
        playerFrame: document.querySelector("#playerFrame"),
        playerTitle: document.querySelector("#playerTitle"),
        playerMeta: document.querySelector("#playerMeta"),
        favoriteButton: document.querySelector("#favoriteButton"),
        youtubeButton: document.querySelector("#youtubeButton"),
        toast: document.querySelector("#toast"),
      };

      function readStorage(key) {
        try {
          const value = JSON.parse(localStorage.getItem(key) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          // Tarayıcı depolamayı engellerse sayfanın geri kalanı çalışmaya devam eder.
        }
      }

      function isFavorite(videoId) {
        return readStorage(STORAGE_KEYS.favorites).includes(videoId);
      }

      function normalizeText(value) {
        return String(value)
          .toLocaleLowerCase("tr-TR")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[ı]/g, "i")
          .replace(/[ğ]/g, "g")
          .replace(/[ü]/g, "u")
          .replace(/[ş]/g, "s")
          .replace(/[ö]/g, "o")
          .replace(/[ç]/g, "c");
      }

      function matchesSearch(video) {
        const query = normalizeText(state.searchTerm.trim());
        if (!query) return true;

        const searchableText = normalizeText(
          `${video.title} ${video.channel} ${video.category}`,
        );

        // "tarkan geççek" gibi birden fazla kelimede bütün kelimeler aranır.
        return query
          .split(/\s+/)
          .filter(Boolean)
          .every((word) => searchableText.includes(word));
      }

      function getFilteredVideos() {
        return videos.filter((video) => {
          const categoryMatches =
            state.activeCategory === "Tümü" || video.category === state.activeCategory;
          const modeMatches =
            state.mode === "home" ||
            (state.mode === "favorites" && isFavorite(video.id)) ||
            (state.mode === "history" && readStorage(STORAGE_KEYS.history).includes(video.id));

          return categoryMatches && modeMatches && matchesSearch(video);
        });
      }

      function createVideoFromPiped(item, category) {
        const id = String(item.url || "").match(/[?&]v=([^&]+)/)?.[1];
        if (!id || !item.title) return null;
        return {
          id,
          title: item.title,
          channel: item.uploaderName || "YouTube kanalı",
          channelKey: normalizeText(item.uploaderName || "youtube").replace(/\s+/g, ""),
          initials: (item.uploaderName || "Y").slice(0, 1).toLocaleUpperCase("tr-TR"),
          views: Number(item.views || 0).toLocaleString("tr-TR"),
          age: item.uploadedDate || "Yeni",
          duration: Number(item.duration || 0) ? formatDuration(item.duration) : "—",
          category,
          thumbnail: item.thumbnail || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`,
          avatarBackground: "linear-gradient(135deg, #ec4899, #4f46e5)",
        };
      }

      function createVideoFromInvidious(item, category) {
        if (!item.videoId || !item.title) return null;
        const thumbnail =
          item.videoThumbnails?.find((image) => image.quality === "medium")?.url ||
          `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`;
        return {
          id: item.videoId,
          title: item.title,
          channel: item.author || "YouTube kanalı",
          channelKey: normalizeText(item.author || "youtube").replace(/\s+/g, ""),
          initials: (item.author || "Y").slice(0, 1).toLocaleUpperCase("tr-TR"),
          views: Number(item.viewCount || 0).toLocaleString("tr-TR"),
          age: item.publishedText || "Yeni",
          duration: Number(item.lengthSeconds || 0) ? formatDuration(item.lengthSeconds) : "—",
          category,
          thumbnail,
          avatarBackground: "linear-gradient(135deg, #ec4899, #4f46e5)",
        };
      }

      function formatDuration(seconds) {
        const total = Math.max(0, Number(seconds) || 0);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const secs = Math.floor(total % 60);
        return hours
          ? `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`
          : `${minutes}:${String(secs).padStart(2, "0")}`;
      }

      async function fetchWithTimeout(url, options = {}, timeout = 9000) {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), timeout);
        try {
          const response = await fetch(url, {
            ...options,
            signal: controller.signal,
            headers: { Accept: "application/json", ...(options.headers || {}) },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } finally {
          window.clearTimeout(timer);
        }
      }

      async function searchPiped(query, category, page = 1) {
        for (const server of FALLBACK_API_SERVERS) {
          try {
            const data = await fetchWithTimeout(
              `${server}/search?q=${encodeURIComponent(query)}&filter=videos&page=${page}`,
            );
            const results = (data.items || data).map((item) =>
              createVideoFromPiped(item, category),
            );
            const valid = results.filter(Boolean);
            if (valid.length) return valid;
          } catch {
            // Bir açık sunucu cevap vermezse sıradaki denenir.
          }
        }
        return [];
      }

      async function searchInvidious(query, category, page = 1) {
        for (const server of FALLBACK_INVIDIOUS_SERVERS) {
          try {
            const data = await fetchWithTimeout(
              `${server}/api/v1/search?q=${encodeURIComponent(query)}&type=video&page=${page}`,
            );
            const valid = data.map((item) => createVideoFromInvidious(item, category)).filter(Boolean);
            if (valid.length) return valid;
          } catch {
            // Bir açık sunucu cevap vermezse sıradaki denenir.
          }
        }
        return [];
      }

      function uniqueVideos(list) {
        const seen = new Set();
        return list.filter((video) => {
          if (!video || seen.has(video.id)) return false;
          seen.add(video.id);
          return true;
        });
      }

      function shuffle(list) {
        return [...list].sort(() => Math.random() - 0.5);
      }

      async function loadFromOpenSearch(query, category = "YouTube", page = 1) {
        const piped = await searchPiped(query, category, page);
        if (piped.length) return uniqueVideos(piped);
        return uniqueVideos(await searchInvidious(query, category, page));
      }

      async function loadHomeFeed() {
        apiState.loading = true;
        apiState.lastError = "";
        elements.pageTitle.textContent = "Ana Sayfa";
        elements.resultCount.textContent = "YouTube videoları yükleniyor…";

        // Her yenilemede arama konuları karıştırıldığı için ana sayfa değişir.
        const selectedSearches = shuffle(HOME_SEARCHES);
        const batches = await Promise.all(
          selectedSearches.flatMap((query, index) => [
            loadFromOpenSearch(query, "Genel", 1),
            index < 4 ? loadFromOpenSearch(query, "Genel", 2) : Promise.resolve([]),
          ]),
        );
        const liveVideos = uniqueVideos(batches.flat());

        if (liveVideos.length) {
          videos.splice(0, videos.length, ...shuffle(liveVideos));
          apiState.lastError = liveVideos.length < 100
            ? "Açık arama sunucusu 100'den az sonuç döndürdü."
            : "";
        } else {
          videos.splice(0, videos.length, ...shuffle(originalVideos));
          apiState.lastError = "Canlı arama sunucularına ulaşılamadı; yedek liste gösteriliyor.";
        }

        apiState.loading = false;
        renderCategories();
        renderVideos();
        if (apiState.lastError) showToast(apiState.lastError);
      }

      async function searchLive(query) {
        const requestId = ++apiState.requestId;
        apiState.loading = true;
        elements.resultCount.textContent = "YouTube aranıyor…";
        elements.emptyState.style.display = "none";
        elements.grid.style.display = "grid";

        const liveVideos = await loadFromOpenSearch(query);
        if (requestId !== apiState.requestId) return;

        if (liveVideos.length) {
          videos.splice(0, videos.length, ...liveVideos);
          state.activeCategory = "Tümü";
          renderCategories();
          renderVideos();
        } else {
          videos.splice(0, videos.length, ...originalVideos);
          renderCategories();
          renderVideos();
          showToast("YouTube araması şu an kullanılamıyor; yedek liste gösteriliyor.");
        }
        apiState.loading = false;
      }

      function getFallbackThumbnail(video) {
        const title = video.title.slice(0, 38).replace(/[<>&"]/g, "");
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">` +
          `<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#211c38"/><stop offset="1" stop-color="#8f1d42"/></linearGradient></defs>` +
          `<rect width="640" height="360" fill="url(#g)"/><circle cx="530" cy="90" r="120" fill="#ffffff12"/>` +
          `<text x="32" y="272" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">${title}</text>` +
          `<text x="32" y="310" fill="#ffffffaa" font-family="Arial,sans-serif" font-size="16">YouTune Türkiye</text></svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function getAvatarFallback(video) {
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">` +
          `<defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ff2d55"/><stop offset="1" stop-color="#6448d8"/></linearGradient></defs>` +
          `<circle cx="50" cy="50" r="50" fill="url(#a)"/>` +
          `<text x="50" y="59" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">${video.initials}</text></svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function renderCategories() {
        const categories = ["Tümü", ...new Set(videos.map((video) => video.category))];
        elements.categories.innerHTML = categories
          .map(
            (category) => `
              <button
                class="category ${state.activeCategory === category ? "active" : ""}"
                type="button"
                data-category="${category}"
                aria-pressed="${state.activeCategory === category}"
              >
                ${category}
              </button>
            `,
          )
          .join("");
      }

      function renderVideos() {
        state.visibleVideos = getFilteredVideos();
        const list = state.visibleVideos;
        elements.resultCount.textContent = `${list.length} video bulundu`;
        elements.emptyState.style.display = list.length ? "none" : "block";
        elements.grid.style.display = list.length ? "grid" : "none";

        elements.grid.innerHTML = list
          .map(
            (video, index) => `
              <article
                class="video-card"
                tabindex="0"
                role="button"
                data-video-id="${video.id}"
                style="animation-delay: ${Math.min(index * 35, 350)}ms"
                aria-label="${video.title}"
              >
                <div class="thumbnail-wrap">
                  <img
                    class="thumbnail"
                    src="${video.thumbnail || `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`}"
                    alt="${video.title}"
                    loading="lazy"
                    data-fallback="${getFallbackThumbnail(video)}"
                  />
                  <span class="play-overlay" aria-hidden="true">▶</span>
                  <span class="duration">${video.duration}</span>
                </div>
                <div class="video-info">
                  <div
                    class="channel-avatar"
                    style="--avatar-bg: ${video.avatarBackground}"
                    aria-label="${video.channel} kanal fotoğrafı"
                  >
                    <img
                      src="https://unavatar.io/youtube/${video.channelKey}"
                      alt=""
                      loading="lazy"
                      data-avatar-fallback="${getAvatarFallback(video)}"
                    />
                  </div>
                  <div class="video-copy">
                    <h2 class="video-title">${video.title}</h2>
                    <p class="video-meta">${video.channel}<br />${video.views} izlenme • ${video.age}</p>
                  </div>
                </div>
              </article>
            `,
          )
          .join("");

        elements.grid.querySelectorAll(".thumbnail").forEach((image) => {
          image.addEventListener(
            "error",
            () => {
              image.src = image.dataset.fallback;
            },
            { once: true },
          );
        });

        elements.grid.querySelectorAll(".channel-avatar img").forEach((image) => {
          image.addEventListener(
            "error",
            () => {
              image.src = image.dataset.avatarFallback;
            },
            { once: true },
          );
        });
      }

      function updateTitle() {
        const titleByMode = {
          home: state.searchTerm ? `"${state.searchTerm}" sonuçları` : "Ana Sayfa",
          favorites: "Favoriler",
          history: "Geçmiş",
        };
        elements.pageTitle.textContent = titleByMode[state.mode];
      }

      function setMode(mode) {
        state.mode = mode;
        document.querySelectorAll(".nav-button").forEach((button) => {
          button.classList.toggle("active", button.id === `${mode}Button`);
        });
        updateTitle();
        renderVideos();
      }

      function saveToHistory(videoId) {
        const history = readStorage(STORAGE_KEYS.history).filter((id) => id !== videoId);
        writeStorage(STORAGE_KEYS.history, [videoId, ...history].slice(0, 50));
      }

      function updateFavoriteButton() {
        if (!state.activeVideo) return;
        const favorite = isFavorite(state.activeVideo.id);
        elements.favoriteButton.textContent = favorite ? "♥ Favorilerden çıkar" : "♡ Favorile";
        elements.favoriteButton.classList.toggle("selected", favorite);
      }

      function openVideo(videoId) {
        const video = videos.find((item) => item.id === videoId);
        if (!video) return;

        state.activeVideo = video;
        saveToHistory(video.id);
        elements.playerTitle.textContent = video.title;
        elements.playerMeta.textContent = `${video.channel} • ${video.views} izlenme • ${video.age}`;
        elements.youtubeButton.href = `https://www.youtube.com/watch?v=${video.id}`;
        elements.playerFrame.innerHTML = `
          <iframe
            src="https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0"
            title="${video.title}"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen
          ></iframe>
        `;
        updateFavoriteButton();
        elements.modal.classList.add("open");
        elements.modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeVideo() {
        elements.modal.classList.remove("open");
        elements.modal.setAttribute("aria-hidden", "true");
        elements.playerFrame.innerHTML = "";
        document.body.style.overflow = "";
        state.activeVideo = null;
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => {
          elements.toast.classList.remove("show");
        }, 2600);
      }

      let searchTimer = 0;

      elements.searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        state.searchTerm = elements.searchInput.value;
        state.mode = "home";
        updateTitle();
        if (state.searchTerm.trim()) searchLive(state.searchTerm.trim());
        else loadHomeFeed();
      });

      // Arama tuşuna basmayı beklemeden sonuçları güncelle.
      elements.searchInput.addEventListener("input", () => {
        state.searchTerm = elements.searchInput.value;
        state.mode = "home";
        updateTitle();
        window.clearTimeout(searchTimer);
        if (!state.searchTerm.trim()) {
          renderVideos();
          return;
        }
        searchTimer = window.setTimeout(() => searchLive(state.searchTerm.trim()), 450);
      });

      elements.categories.addEventListener("click", (event) => {
        const categoryButton = event.target.closest("[data-category]");
        if (!categoryButton) return;
        state.activeCategory = categoryButton.dataset.category;
        renderCategories();
        renderVideos();
      });

      elements.grid.addEventListener("click", (event) => {
        const card = event.target.closest("[data-video-id]");
        if (card) openVideo(card.dataset.videoId);
      });

      elements.grid.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-video-id]");
        if (!card) return;
        event.preventDefault();
        openVideo(card.dataset.videoId);
      });

      document.querySelector("#homeButton").addEventListener("click", () => setMode("home"));
      document
        .querySelector("#favoritesButton")
        .addEventListener("click", () => setMode("favorites"));
      document.querySelector("#historyButton").addEventListener("click", () => setMode("history"));

      document.querySelector("#brandButton").addEventListener("click", () => {
        state.mode = "home";
        state.activeCategory = "Tümü";
        state.searchTerm = "";
        elements.searchInput.value = "";
        renderCategories();
        setMode("home");
      });

      document.querySelector("#randomButton").addEventListener("click", () => {
        const shuffled = [...videos].sort(() => Math.random() - 0.5);
        videos.splice(0, videos.length, ...shuffled);
        renderVideos();
      });

      document.querySelector("#clearSearchButton").addEventListener("click", () => {
        state.searchTerm = "";
        elements.searchInput.value = "";
        updateTitle();
        loadHomeFeed();
      });

      document.querySelector("#closeModalButton").addEventListener("click", closeVideo);
      elements.modal.addEventListener("click", (event) => {
        if (event.target === elements.modal) closeVideo();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && elements.modal.classList.contains("open")) closeVideo();
      });

      elements.favoriteButton.addEventListener("click", () => {
        if (!state.activeVideo) return;
        const favorites = readStorage(STORAGE_KEYS.favorites);
        const favorite = isFavorite(state.activeVideo.id);
        const nextFavorites = favorite
          ? favorites.filter((id) => id !== state.activeVideo.id)
          : [state.activeVideo.id, ...favorites];

        writeStorage(STORAGE_KEYS.favorites, nextFavorites);
        updateFavoriteButton();
        showToast(favorite ? "Video favorilerden çıkarıldı." : "Video favorilere eklendi.");
        if (state.mode === "favorites") renderVideos();
      });

      document.querySelector("#shareButton").addEventListener("click", async () => {
        if (!state.activeVideo) return;
        const url = `https://www.youtube.com/watch?v=${state.activeVideo.id}`;

        try {
          if (navigator.share) {
            await navigator.share({ title: state.activeVideo.title, url });
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(url);
            showToast("YouTube bağlantısı kopyalandı.");
          } else {
            window.prompt("Bağlantıyı kopyalayın:", url);
          }
        } catch {
          // Kullanıcı paylaşım penceresini kapatırsa hata göstermek gerekmez.
        }
      });

      // Sayfa açılışında kartların tamamını göster.
      renderCategories();
      renderVideos();
      loadHomeFeed();
    </script>
  </body>
</html>
