<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Türkiye trend videolarını ve kategori akışlarını keşfetmek için tek dosyalık YouTune arayüzü."
    />
    <title>YouTune Türkiye</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");

      :root {
        --bg: #0d0f13;
        --surface: #151820;
        --surface-raised: #1b1f2a;
        --surface-hover: #232836;
        --line: #2a3040;
        --text: #f4f6fb;
        --muted: #8f98aa;
        --accent: #ff3652;
        --accent-strong: #ff1740;
        --accent-soft: rgba(255, 54, 82, 0.14);
        --success: #69d7a5;
        --radius: 15px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 88% -10%, rgba(255, 54, 82, 0.1), transparent 30rem),
          var(--bg);
        font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        min-height: 100vh;
        padding-bottom: 80px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 20px;
        min-height: 62px;
        padding: 9px clamp(15px, 3vw, 38px);
        background: rgba(13, 15, 19, 0.9);
        border-bottom: 1px solid rgba(42, 48, 64, 0.82);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: max-content;
        font-family: "Space Grotesk", sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.45px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 27px;
        height: 22px;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), #ff6378);
        border-radius: 7px;
        box-shadow: 0 5px 18px rgba(255, 54, 82, 0.26);
      }

      .brand-mark svg {
        width: 11px;
        height: 11px;
        margin-left: 1px;
        fill: currentColor;
      }

      .search-form {
        display: flex;
        flex: 1;
        max-width: 660px;
        margin: 0 auto;
      }

      .search-form input {
        width: 100%;
        height: 37px;
        padding: 0 14px;
        color: var(--text);
        background: rgba(21, 24, 32, 0.96);
        border: 1px solid var(--line);
        border-right: 0;
        border-radius: 11px 0 0 11px;
        outline: none;
        font-size: 12px;
      }

      .search-form input::placeholder {
        color: #6f788b;
      }

      .search-form input:focus {
        border-color: rgba(255, 54, 82, 0.75);
      }

      .search-form button {
        display: grid;
        place-items: center;
        width: 44px;
        color: var(--text);
        background: var(--surface-raised);
        border: 1px solid var(--line);
        border-radius: 0 11px 11px 0;
      }

      .search-form button:hover {
        color: var(--accent);
      }

      .header-action {
        display: grid;
        place-items: center;
        width: 35px;
        height: 35px;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 10px;
      }

      .header-action:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      .header-action svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      main {
        width: min(1450px, calc(100% - 36px));
        margin: 0 auto;
        padding-top: 27px;
      }

      .inline-player {
        width: 100vw;
        margin: 0 0 26px calc(50% - 50vw);
        padding: 10px max(18px, calc((100vw - 920px) / 2)) 19px;
        background: rgba(13, 15, 19, 0.96);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 18px 65px rgba(0, 0, 0, 0.35);
      }

      .inline-player-frame {
        width: min(900px, 100%);
        margin: 0 auto;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
      }

      .inline-player-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .inline-player-details {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        width: min(900px, 100%);
        margin: 0 auto;
        padding: 12px 2px 0;
      }

      .inline-player-details h2 {
        margin: 0 0 4px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 17px;
        letter-spacing: -0.35px;
      }

      .inline-player-details p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .inline-player-actions,
      .player-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .inline-player-actions button,
      .inline-player-actions a,
      .player-actions button,
      .player-actions a {
        padding: 7px 10px;
        color: var(--text);
        text-decoration: none;
        background: var(--surface-raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 11px;
        font-weight: 600;
      }

      .inline-player-actions button:hover,
      .inline-player-actions a:hover,
      .inline-player-actions .selected,
      .player-actions button:hover,
      .player-actions a:hover,
      .player-actions .selected {
        color: #fff;
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .hero {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 19px;
      }

      .hero h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(23px, 3vw, 34px);
        letter-spacing: -1.2px;
      }

      .hero p {
        max-width: 560px;
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .hero-side {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        white-space: nowrap;
        font-size: 11px;
      }

      .live-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: var(--success);
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(105, 215, 165, 0.1);
      }

      .refresh-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 11px;
      }

      .refresh-button:hover {
        color: #fff;
        border-color: var(--accent);
      }

      .refresh-button svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }

      .categories {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 2px 0 21px;
        scrollbar-width: none;
      }

      .categories::-webkit-scrollbar {
        display: none;
      }

      .category {
        flex: 0 0 auto;
        padding: 7px 12px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 11px;
        font-weight: 600;
        transition: 0.18s ease;
      }

      .category:hover,
      .category.active {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
        gap: 27px 17px;
      }

      .video-card {
        min-width: 0;
        outline: none;
        border-radius: var(--radius);
        transition: transform 0.2s ease;
      }

      .video-card:hover,
      .video-card:focus-visible {
        transform: translateY(-4px);
      }

      .thumbnail-wrap {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        background: #252a37;
        border-radius: var(--radius);
      }

      .thumbnail-wrap::after {
        position: absolute;
        inset: 0;
        content: "";
        pointer-events: none;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 55%);
      }

      .thumbnail-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .video-card:hover .thumbnail-wrap img {
        transform: scale(1.035);
      }

      .duration {
        position: absolute;
        right: 7px;
        bottom: 7px;
        z-index: 1;
        padding: 3px 5px;
        color: #fff;
        background: rgba(0, 0, 0, 0.82);
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
      }

      .play-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        color: white;
        background: rgba(0, 0, 0, 0.32);
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .play-overlay svg {
        width: 35px;
        height: 35px;
        padding: 10px;
        background: rgba(255, 54, 82, 0.9);
        border-radius: 50%;
        fill: currentColor;
      }

      .video-card:hover .play-overlay,
      .video-card:focus-visible .play-overlay {
        opacity: 1;
      }

      .video-info {
        display: flex;
        gap: 9px;
        padding: 10px 2px 0;
      }

      .channel-avatar {
        display: grid;
        flex: 0 0 31px;
        place-items: center;
        width: 31px;
        height: 31px;
        color: #fff;
        background: linear-gradient(135deg, #ff5b73, #9d1935);
        border-radius: 50%;
        font-size: 11px;
        font-weight: 700;
      }

      .video-copy {
        min-width: 0;
      }

      .video-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 0 0 4px;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.34;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .video-meta {
        margin: 0;
        color: var(--muted);
        font-size: 10.5px;
        line-height: 1.45;
      }

      .status-bar {
        min-height: 19px;
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
      }

      .empty {
        display: none;
        padding: 82px 20px;
        color: var(--muted);
        text-align: center;
      }

      .empty strong {
        display: block;
        margin-bottom: 7px;
        color: var(--text);
        font-family: "Space Grotesk", sans-serif;
        font-size: 18px;
      }

      .skeleton {
        overflow: hidden;
        aspect-ratio: 16 / 9;
        background: linear-gradient(90deg, #181c26 25%, #232936 50%, #181c26 75%);
        background-size: 200% 100%;
        border-radius: var(--radius);
        animation: loading 1.3s infinite;
      }

      @keyframes loading {
        to {
          background-position: -200% 0;
        }
      }

      .load-more {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        margin: 34px 0 18px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }

      .load-more.visible {
        display: flex;
      }

      .loaded-count {
        color: var(--muted);
        font-size: 10px;
      }

      .load-more button {
        padding: 8px 14px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 11px;
        font-weight: 700;
      }

      .load-more button:hover {
        background: var(--accent);
        border-color: var(--accent);
      }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        gap: clamp(26px, 8vw, 96px);
        min-height: 62px;
        padding: 7px 12px;
        background: rgba(21, 24, 32, 0.95);
        border-top: 1px solid var(--line);
        backdrop-filter: blur(17px);
      }

      .nav-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-width: 67px;
        color: var(--muted);
        background: transparent;
        border: 0;
        font-size: 10px;
        font-weight: 600;
        transition: color 0.18s ease;
      }

      .nav-button svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      .nav-button.active,
      .nav-button:hover {
        color: var(--accent);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(0, 0, 0, 0.82);
      }

      .modal.open {
        display: flex;
      }

      .player-panel {
        width: min(950px, 100%);
        max-height: calc(100vh - 36px);
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 15px;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.55);
      }

      .player-top {
        display: flex;
        justify-content: end;
        padding: 7px 7px 0;
      }

      .close-button {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        color: var(--text);
        background: var(--surface-raised);
        border: 0;
        border-radius: 9px;
        font-size: 18px;
      }

      .close-button:hover {
        background: var(--accent);
      }

      .player-frame {
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .player-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .player-details {
        padding: 16px 20px 21px;
      }

      .player-details h2 {
        margin: 0 0 7px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 18px;
      }

      .player-details p {
        margin: 0 0 15px;
        color: var(--muted);
        font-size: 11px;
      }

      @media (max-width: 650px) {
        header {
          gap: 9px;
          padding: 8px 13px;
        }

        .brand {
          font-size: 14px;
        }

        .brand-mark {
          width: 24px;
          height: 20px;
        }

        .header-action {
          display: none;
        }

        main {
          width: min(100% - 26px, 1450px);
          padding-top: 20px;
        }

        .inline-player {
          padding: 7px 13px 14px;
        }

        .inline-player-details {
          display: block;
        }

        .inline-player-actions {
          margin-top: 10px;
        }

        .hero {
          display: block;
        }

        .hero-side {
          justify-content: space-between;
          margin-top: 13px;
        }

        .video-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 21px 10px;
        }

        .channel-avatar {
          display: none;
        }

        .video-info {
          padding-top: 8px;
        }

        .video-title {
          font-size: 11.5px;
        }

        .video-meta {
          font-size: 9.5px;
        }

        .bottom-nav {
          justify-content: space-around;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z" /></svg>
          </span>
          <span>YouTune Türkiye</span>
        </div>

        <form class="search-form" id="searchForm" role="search">
          <input id="searchInput" type="search" placeholder="Video, kanal veya konu ara..." aria-label="Video ara" />
          <button type="submit" aria-label="Ara">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="10.8" cy="10.8" r="6.8" />
              <path d="m16 16 5 5" />
            </svg>
          </button>
        </form>

        <button class="header-action" id="topRefreshButton" type="button" aria-label="Trendleri yenile">
          <svg viewBox="0 0 24 24">
            <path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4" />
          </svg>
        </button>
      </header>

      <main>
        <section class="inline-player" id="inlinePlayer" aria-label="Video oynatıcı" hidden>
          <div class="inline-player-frame" id="playerFrame"></div>
          <div class="inline-player-details">
            <div>
              <h2 id="playerTitle">Video seçilmedi</h2>
              <p id="playerMeta">İzlemek için aşağıdaki videolardan birini seç.</p>
            </div>
            <div class="inline-player-actions">
              <button id="favoriteButton" type="button">♡ Favorile</button>
              <button id="shareButton" type="button">↗ Paylaş</button>
              <a id="youtubeButton" target="_blank" rel="noopener noreferrer">YouTube'da Aç</a>
            </div>
          </div>
        </section>

        <section class="hero">
          <div>
            <h1 id="pageTitle">Türkiye'de bugün</h1>
            <p id="pageSubtitle">Türkiye'de yükselen videoları keşfet. Her yenilemede yeni bir seçki hazırlanır.</p>
          </div>
          <div class="hero-side">
            <span><i class="live-dot"></i> Canlı akış</span>
            <button class="refresh-button" id="refreshButton" type="button">
              <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4" /></svg>
              Yenile
            </button>
          </div>
        </section>

        <div class="status-bar" id="statusBar" aria-live="polite"></div>
        <nav class="categories" id="categories" aria-label="Video kategorileri"></nav>
        <section class="video-grid" id="videoGrid" aria-live="polite"></section>
        <section class="empty" id="emptyState">
          <strong>Video bulunamadı</strong>
          Başka bir kategori veya arama kelimesi deneyebilirsin.
        </section>
        <section class="load-more" id="loadMoreBox">
          <div class="loaded-count" id="loadedCount"></div>
          <button id="loadMoreButton" type="button">Daha fazla yükle</button>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Alt menü">
        <button class="nav-button active" id="homeButton" type="button">
          <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z" /><path d="M9 21v-6h6v6" /></svg>
          Ana Sayfa
        </button>
        <button class="nav-button" id="favoritesButton" type="button">
          <svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z" /></svg>
          Favoriler
        </button>
        <button class="nav-button" id="historyButton" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 7v5l3.5 2M3.5 12H1M4 7.8 2.5 6.5" /></svg>
          Geçmiş
        </button>
      </nav>
    </div>

    <script>
      "use strict";

      /*
       * Canlı veri için anahtar gerektirmeyen açık Piped / Invidious uçları denenir.
       * Uçlardan biri çalışmazsa sıradaki denenir; hepsi kapalıysa yedek seçki gösterilir.
       */
      const LIVE_ENDPOINTS = [
        { type: "piped-trending", url: "https://pipedapi.adminforge.de/trending" },
        { type: "piped-trending", url: "https://pipedapi.kavin.rocks/trending" },
        { type: "invidious-trending", url: "https://inv.nadeko.net/api/v1/trending" },
        { type: "invidious-trending", url: "https://inv.tux.pizza/api/v1/trending" }
      ];

      const SEARCH_ENDPOINTS = [
        { type: "piped-search", url: "https://pipedapi.adminforge.de/search" },
        { type: "piped-search", url: "https://pipedapi.kavin.rocks/search" },
        { type: "invidious-search", url: "https://inv.nadeko.net/api/v1/search" },
        { type: "invidious-search", url: "https://inv.tux.pizza/api/v1/search" }
      ];

      const CATEGORY_CONFIG = [
        { label: "Tümü", query: "Türkiye trend" },
        { label: "Türkiye", query: "Türkiye gündem trend" },
        { label: "Oyun", query: "Türkiye oyun trend" },
        { label: "Müzik", query: "Türkçe müzik yeni çıkan" },
        { label: "Haber", query: "Türkiye son dakika haber" },
        { label: "Eğlence", query: "Türkiye eğlence magazin" },
        { label: "Spor", query: "Türkiye spor" },
        { label: "Eğitim", query: "Türkiye eğitim" }
      ];

      /* Canlı uçlara erişilemezse kullanılacak son güvenli yedekler. */
      const FALLBACK_VIDEOS = [
        { id: "rNFsWlJm09k", title: "Yeni Çıkan Türkçe Şarkılar", channel: "Adres Müzik", views: "4,8 B görüntüleme", age: "1 gün önce", duration: "8:34", category: "Müzik" },
        { id: "-FQ_-OMgzMY", title: "Yeni Çıkan Türkçe Şarkılar", channel: "Adres Müzik", views: "39 B görüntüleme", age: "8 gün önce", duration: "8:13", category: "Müzik" },
        { id: "HZObP-SbHEM", title: "Blippi ile Dinozorları Keşfet! | Blippi Türkçe", channel: "Blippi Türkçe", views: "10 Mn görüntüleme", age: "3 yıl önce", duration: "7:03", category: "Eğitim" },
        { id: "EwJgpDYwFhk", title: "En Komik Video Derlemeleri", channel: "Çılgın Türkler", views: "77 B görüntüleme", age: "2 yıl önce", duration: "7:05", category: "Eğlence" },
        { id: "XZK42t0g3-c", title: "2000'ler Türkçe Pop | HD Video Klip", channel: "Dj Burak Kilincoglu", views: "4,2 Mn görüntüleme", age: "1 yıl önce", duration: "20:34", category: "Müzik" },
        { id: "PPWl1FK2BRQ", title: "Çağla - Saz mı Caz mı?", channel: "netd müzik", views: "366 Mn görüntüleme", age: "8 yıl önce", duration: "3:26", category: "Müzik" },
        { id: "35X2Km-5j00", title: "Mavi Vatan'ın renk sırrı: TCG Anadolu neden gri?", channel: "GZT", views: "42 B görüntüleme", age: "2 gün önce", duration: "0:50", category: "Haber" },
        { id: "K_KpomHNcc0", title: "Türk-İsrail Savaşında Kürtler Hangi Tarafta?", channel: "İbrahim Halil Baran", views: "52 B görüntüleme", age: "2 gün önce", duration: "1:09:12", category: "Haber" },
        { id: "F64PRO93e3w", title: "Darbe olacak sanıp cumhurbaşkanı Erdoğan'ı tehdit etmiş!", channel: "TVNET", views: "749 B görüntüleme", age: "4 gün önce", duration: "0:42", category: "Haber" },
        { id: "LdghWhfJPUA", title: "1 Dolar vs. 500.000 Dolarlık Deneyimler!", channel: "MrBeast Türkiye", views: "13 B görüntüleme", age: "1 yıl önce", duration: "17:34", category: "Eğlence" },
        { id: "aqz-KE-bpKQ", title: "Türkiye'nin En İyi Oyun Anları", channel: "Gaming Türkiye", views: "128 B görüntüleme", age: "3 gün önce", duration: "12:10", category: "Oyun" },
        { id: "7wtfhZwyrcc", title: "Türkçe Rock Klasikleri", channel: "Müzik Arşivi", views: "2,1 Mn görüntüleme", age: "2 ay önce", duration: "10:22", category: "Müzik" }
      ];

      const grid = document.querySelector("#videoGrid");
      const emptyState = document.querySelector("#emptyState");
      const categoriesEl = document.querySelector("#categories");
      const searchInput = document.querySelector("#searchInput");
      const resultStatus = document.querySelector("#statusBar");
      const favoriteButton = document.querySelector("#favoriteButton");
      const playerFrame = document.querySelector("#playerFrame");

      let catalog = new Map(FALLBACK_VIDEOS.map((video) => [video.id, video]));
      let homeVideos = shuffle(FALLBACK_VIDEOS).slice(0, 10);
      let remoteVideos = null;
      let activeCategory = "Tümü";
      let activeVideo = null;
      let mode = "home";
      let searchTerm = "";
      let remoteQuery = "";
      let searchPage = 0;
      let hasMoreSearchResults = false;
      let searchLoading = false;
      let homeLoading = false;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function shuffle(items) {
        const output = [...items];
        for (let index = output.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [output[index], output[randomIndex]] = [output[randomIndex], output[index]];
        }
        return output;
      }

      function getStored(key) {
        try {
          const value = JSON.parse(localStorage.getItem(key) || "[]");
          return Array.isArray(value) ? value : [];
        } catch (_) {
          return [];
        }
      }

      function setStored(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (_) {
          /* Depolama kapalıysa temel video akışı yine çalışır. */
        }
      }

      function rememberVideo(video) {
        catalog.set(video.id, video);
        try {
          localStorage.setItem("youtune-library", JSON.stringify([...catalog.entries()].slice(-100)));
        } catch (_) {}
      }

      function restoreLibrary() {
        try {
          const saved = JSON.parse(localStorage.getItem("youtune-library") || "[]");
          if (Array.isArray(saved)) {
            saved.forEach(([id, video]) => {
              if (id && video) catalog.set(id, video);
            });
          }
        } catch (_) {}
      }

      function isFavorite(id) {
        return getStored("youtune-favorites").includes(id);
      }

      function formatDuration(seconds) {
        if (!seconds && seconds !== 0) return "";
        if (typeof seconds === "string") return seconds;
        const minutes = Math.floor(seconds / 60);
        const remaining = Math.floor(seconds % 60);
        return `${minutes}:${remaining < 10 ? "0" : ""}${remaining}`;
      }

      function formatViews(views) {
        if (!views && views !== 0) return "";
        if (typeof views === "string") return views;
        if (views >= 1000000) return `${(views / 1000000).toFixed(1)} Mn görüntüleme`;
        if (views >= 1000) return `${Math.round(views / 1000)} B görüntüleme`;
        return `${views} görüntüleme`;
      }

      function normalizeRemoteItem(item, category = "Türkiye") {
        let id = item.videoId || item.id || "";
        if (!id && item.url) {
          const match = item.url.match(/[?&]v=([^&]+)/);
          id = match ? match[1] : item.url.replace("/watch?v=", "").split("&")[0];
        }

        const thumbnails = item.videoThumbnails || [];
        const thumbnail = item.thumbnail || thumbnails.at(-1)?.url || "";
        return {
          id,
          title: item.title || "Başlıksız video",
          channel: item.uploaderName || item.author || item.uploader || "Kanal",
          views: formatViews(item.views ?? item.viewCount),
          age: item.uploadedDate || item.publishedText || "",
          duration: formatDuration(item.duration ?? item.lengthSeconds),
          category,
          thumbnail
        };
      }

      async function requestJson(url) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6500);
        try {
          const response = await fetch(url, {
            signal: controller.signal,
            cache: "no-store",
            headers: { Accept: "application/json" }
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } finally {
          clearTimeout(timer);
        }
      }

      async function fetchLiveTrending() {
        for (const endpoint of LIVE_ENDPOINTS) {
          try {
            const url = endpoint.type === "piped-trending"
              ? `${endpoint.url}?region=TR`
              : `${endpoint.url}?region=TR`;
            const data = await requestJson(url);
            const items = Array.isArray(data) ? data : data.items || [];
            const videos = items.map((item) => normalizeRemoteItem(item, "Türkiye")).filter((video) => video.id);
            if (videos.length) return videos;
          } catch (_) {}
        }
        return [];
      }

      async function fetchCategoryVideos(category) {
        const categoryConfig = CATEGORY_CONFIG.find((item) => item.label === category) || CATEGORY_CONFIG[1];
        const query = categoryConfig.query;

        for (const endpoint of SEARCH_ENDPOINTS) {
          try {
            const url = endpoint.type === "piped-search"
              ? `${endpoint.url}?q=${encodeURIComponent(query)}&filter=videos&region=TR`
              : `${endpoint.url}?q=${encodeURIComponent(query)}&type=video&page=1`;
            const data = await requestJson(url);
            const items = Array.isArray(data) ? data : data.items || [];
            const videos = items
              .map((item) => normalizeRemoteItem(item, category))
              .filter((video) => video.id);
            if (videos.length) return videos;
          } catch (_) {}
        }
        return [];
      }

      function getLibraryVideos() {
        const ids = mode === "favorites"
          ? getStored("youtune-favorites")
          : getStored("youtune-history");
        return ids.map((id) => catalog.get(id)).filter(Boolean);
      }

      function filteredVideos() {
        let sourceVideos;
        if (mode === "favorites" || mode === "history") sourceVideos = getLibraryVideos();
        else sourceVideos = remoteVideos || homeVideos;

        const term = searchTerm.trim().toLocaleLowerCase("tr-TR");
        return sourceVideos.filter((video) => {
          const categoryMatch = activeCategory === "Tümü"
            || activeCategory === "Arama"
            || video.category === activeCategory;
          const text = `${video.title} ${video.channel} ${video.category}`.toLocaleLowerCase("tr-TR");
          return categoryMatch && (!term || text.includes(term));
        });
      }

      function renderLoading() {
        grid.innerHTML = Array.from({ length: 8 }, () => `
          <article><div class="skeleton"></div></article>
        `).join("");
        emptyState.style.display = "none";
      }

      function renderCategories() {
        const labels = CATEGORY_CONFIG.map((item) => item.label);
        if (remoteQuery) labels.push("Arama");
        categoriesEl.innerHTML = labels.map((category) => `
          <button class="category ${activeCategory === category ? "active" : ""}" type="button" data-category="${escapeHtml(category)}">
            ${escapeHtml(category)}
          </button>
        `).join("");
      }

      function renderVideos() {
        const visibleVideos = filteredVideos();
        const sourceCount = remoteVideos?.length || homeVideos.length;
        resultStatus.textContent = mode === "favorites"
          ? `${visibleVideos.length} favori video`
          : mode === "history"
            ? `${visibleVideos.length} izlenen video`
            : `${visibleVideos.length} video gösteriliyor${sourceCount ? ` · ${sourceCount} sonuç` : ""}`;

        emptyState.style.display = visibleVideos.length ? "none" : "block";
        grid.innerHTML = visibleVideos.map((video) => {
          rememberVideo(video);
          const thumbnail = video.thumbnail || `https://i.ytimg.com/vi/${encodeURIComponent(video.id)}/hq720.jpg`;
          const fallbackThumbnail = `https://i.ytimg.com/vi/${encodeURIComponent(video.id)}/hqdefault.jpg`;
          return `
            <article class="video-card" tabindex="0" role="button" data-video-id="${escapeHtml(video.id)}" aria-label="${escapeHtml(video.title)}">
              <div class="thumbnail-wrap">
                <img src="${escapeHtml(thumbnail)}" alt="" loading="lazy"
                  onerror="this.onerror=null;this.src='${escapeHtml(fallbackThumbnail)}';" />
                <span class="play-overlay" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z" /></svg>
                </span>
                ${video.duration ? `<span class="duration">${escapeHtml(video.duration)}</span>` : ""}
              </div>
              <div class="video-info">
                <div class="channel-avatar">${escapeHtml((video.channel || "K").charAt(0).toLocaleUpperCase("tr-TR"))}</div>
                <div class="video-copy">
                  <h2 class="video-title">${escapeHtml(video.title)}</h2>
                  <p class="video-meta">${escapeHtml(video.channel)}<br>${escapeHtml(video.views)}${video.age ? ` · ${escapeHtml(video.age)}` : ""}</p>
                </div>
              </div>
            </article>
          `;
        }).join("");

        const loadMoreBox = document.querySelector("#loadMoreBox");
        const loadMoreButton = document.querySelector("#loadMoreButton");
        loadMoreBox.classList.toggle("visible", Boolean(remoteQuery && remoteVideos?.length));
        document.querySelector("#loadedCount").textContent = remoteVideos?.length
          ? `${remoteVideos.length} sonuç yüklendi`
          : "";
        loadMoreButton.hidden = !hasMoreSearchResults;
        loadMoreButton.disabled = searchLoading;
        loadMoreButton.textContent = searchLoading ? "Yükleniyor..." : "Daha fazla yükle";
      }

      async function refreshHome() {
        if (homeLoading) return;
        homeLoading = true;
        mode = "home";
        remoteVideos = null;
        remoteQuery = "";
        searchTerm = "";
        activeCategory = "Tümü";
        document.querySelector("#pageTitle").textContent = "Türkiye'de bugün";
        document.querySelector("#pageSubtitle").textContent = "Türkiye'de yükselen videoları keşfet. Her yenilemede yeni bir seçki hazırlanır.";
        renderCategories();
        renderLoading();
        resultStatus.textContent = "Türkiye trendleri yükleniyor...";

        const liveVideos = await fetchLiveTrending();
        homeVideos = shuffle(liveVideos.length ? liveVideos : FALLBACK_VIDEOS).slice(0, 18);
        homeVideos.forEach(rememberVideo);
        resultStatus.textContent = liveVideos.length
          ? "Canlı Türkiye trendleri · liste her yenilemede karıştırıldı"
          : "Canlı kaynak şu an yanıt vermiyor · yedek seçki karıştırıldı";
        homeLoading = false;
        renderVideos();
      }

      async function selectCategory(category) {
        activeCategory = category;
        mode = "home";
        searchTerm = "";
        document.querySelector("#pageTitle").textContent = category === "Tümü" ? "Türkiye'de bugün" : `${category} trendleri`;
        document.querySelector("#pageSubtitle").textContent = category === "Tümü"
          ? "Türkiye'de yükselen videoları keşfet. Her yenilemede yeni bir seçki hazırlanır."
          : `${category} kategorisinde öne çıkan videoları keşfet.`;
        renderCategories();

        if (category === "Tümü") {
          await refreshHome();
          return;
        }

        renderLoading();
        resultStatus.textContent = `${category} videoları yükleniyor...`;
        const videos = await fetchCategoryVideos(category);
        remoteVideos = null;
        homeVideos = shuffle(videos.length ? videos : FALLBACK_VIDEOS.filter((video) => video.category === category));
        homeVideos.forEach(rememberVideo);
        resultStatus.textContent = videos.length
          ? `${category} akışı · sonuçlar karıştırıldı`
          : `${category} için canlı kaynak bulunamadı`;
        renderVideos();
      }

      function openVideo(id) {
        const video = filteredVideos().find((item) => item.id === id) || catalog.get(id);
        if (!video) return;
        activeVideo = video;
        rememberVideo(video);

        const history = getStored("youtune-history").filter((item) => item !== id);
        setStored("youtune-history", [id, ...history].slice(0, 40));
        document.querySelector("#inlinePlayer").hidden = false;
        document.querySelector("#playerTitle").textContent = video.title;
        document.querySelector("#playerMeta").textContent = `${video.channel} · ${video.views || "YouTube"}${video.age ? ` · ${video.age}` : ""}`;
        document.querySelector("#youtubeButton").href = `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
        favoriteButton.textContent = isFavorite(id) ? "♥ Favorilerden çıkar" : "♡ Favorile";
        favoriteButton.classList.toggle("selected", isFavorite(id));
        playerFrame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${escapeHtml(video.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        document.querySelector("#inlinePlayer").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function setMode(nextMode) {
        mode = nextMode;
        remoteVideos = null;
        remoteQuery = "";
        searchTerm = "";
        activeCategory = "Tümü";
        document.querySelectorAll(".nav-button").forEach((button) => button.classList.remove("active"));
        document.querySelector(`#${nextMode === "home" ? "homeButton" : nextMode === "favorites" ? "favoritesButton" : "historyButton"}`).classList.add("active");
        document.querySelector("#pageTitle").textContent = nextMode === "favorites" ? "Favorilerin" : nextMode === "history" ? "İzleme geçmişin" : "Türkiye'de bugün";
        document.querySelector("#pageSubtitle").textContent = nextMode === "home" ? "Türkiye'de yükselen videoları keşfet. Her yenilemede yeni bir seçki hazırlanır." : "Daha sonra tekrar dönmek istediğin videolar burada.";
        renderCategories();
        renderVideos();
      }

      async function searchVideos(query, page = 1) {
        for (const endpoint of SEARCH_ENDPOINTS) {
          try {
            const url = endpoint.type === "piped-search"
              ? `${endpoint.url}?q=${encodeURIComponent(query)}&filter=videos&region=TR&page=${page}`
              : `${endpoint.url}?q=${encodeURIComponent(query)}&type=video&page=${page}`;
            const data = await requestJson(url);
            const items = Array.isArray(data) ? data : data.items || [];
            const videos = items.map((item) => normalizeRemoteItem(item, "Arama")).filter((video) => video.id);
            if (videos.length) return videos;
          } catch (_) {}
        }
        return [];
      }

      document.querySelector("#searchForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = searchInput.value.trim();
        const submitButton = event.currentTarget.querySelector("button");
        if (query.length < 2) {
          await refreshHome();
          return;
        }

        submitButton.disabled = true;
        mode = "home";
        activeCategory = "Arama";
        searchTerm = "";
        remoteQuery = query;
        resultStatus.textContent = `"${query}" aranıyor...`;
        renderCategories();
        renderLoading();
        const results = await searchVideos(query, 1);
        remoteVideos = shuffle(results);
        searchPage = 1;
        hasMoreSearchResults = results.length >= 20;
        document.querySelector("#pageTitle").textContent = `"${query}" sonuçları`;
        document.querySelector("#pageSubtitle").textContent = "Arama sonuçları her açılışta farklı sırada gösterilir.";
        resultStatus.textContent = results.length ? `${results.length} arama sonucu` : "Arama sonucu bulunamadı";
        remoteVideos.forEach(rememberVideo);
        renderVideos();
        submitButton.disabled = false;
      });

      document.querySelector("#loadMoreButton").addEventListener("click", async () => {
        if (!remoteQuery || !hasMoreSearchResults || searchLoading || !remoteVideos) return;
        searchLoading = true;
        renderVideos();
        const nextVideos = await searchVideos(remoteQuery, searchPage + 1);
        remoteVideos = [...remoteVideos, ...nextVideos].filter((video, index, all) => all.findIndex((item) => item.id === video.id) === index);
        searchPage += 1;
        hasMoreSearchResults = nextVideos.length >= 20;
        searchLoading = false;
        remoteVideos.forEach(rememberVideo);
        renderVideos();
      });

      categoriesEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        if (button.dataset.category === "Arama") {
          activeCategory = "Arama";
          renderCategories();
          renderVideos();
          return;
        }
        selectCategory(button.dataset.category);
      });

      grid.addEventListener("click", (event) => {
        const card = event.target.closest("[data-video-id]");
        if (card) openVideo(card.dataset.videoId);
      });

      grid.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-video-id]");
        if (card) {
          event.preventDefault();
          openVideo(card.dataset.videoId);
        }
      });

      favoriteButton.addEventListener("click", () => {
        if (!activeVideo) return;
        const favorites = getStored("youtune-favorites");
        const next = isFavorite(activeVideo.id)
          ? favorites.filter((id) => id !== activeVideo.id)
          : [activeVideo.id, ...favorites];
        setStored("youtune-favorites", next);
        favoriteButton.textContent = isFavorite(activeVideo.id) ? "♥ Favorilerden çıkar" : "♡ Favorile";
        favoriteButton.classList.toggle("selected", isFavorite(activeVideo.id));
        if (mode === "favorites") renderVideos();
      });

      document.querySelector("#shareButton").addEventListener("click", async () => {
        if (!activeVideo) return;
        const url = `https://www.youtube.com/watch?v=${encodeURIComponent(activeVideo.id)}`;
        if (navigator.share) await navigator.share({ title: activeVideo.title, url });
        else {
          await navigator.clipboard?.writeText(url);
          alert("YouTube bağlantısı kopyalandı.");
        }
      });

      document.querySelector("#homeButton").addEventListener("click", () => setMode("home"));
      document.querySelector("#favoritesButton").addEventListener("click", () => setMode("favorites"));
      document.querySelector("#historyButton").addEventListener("click", () => setMode("history"));
      document.querySelector("#refreshButton").addEventListener("click", refreshHome);
      document.querySelector("#topRefreshButton").addEventListener("click", refreshHome);

      restoreLibrary();
      renderCategories();
      renderVideos();
      refreshHome();
    </script>
  </body>
</html>
