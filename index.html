<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YouTune - Modern YouTube Benzeri Video Platformu" />
    <title>YouTune Türkiye</title>
    <style>
      :root {
        --bg: #0f0f12;
        --surface: #18181c;
        --surface-hover: #222228;
        --surface-2: #282830;
        --line: rgba(255, 255, 255, 0.08);
        --text: #f3f3f5;
        --muted: #a0a0ab;
        --accent: #ff2a4b;
        --accent-glow: rgba(255, 42, 75, 0.4);
        --accent-soft: rgba(255, 42, 75, 0.15);
        --radius: 16px;
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      button, input { font: inherit; }
      button { cursor: pointer; border: none; background: none; }
      .app-shell { min-height: 100vh; padding-bottom: 90px; }

      /* --- HEADER --- */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 70px;
        padding: 10px 32px;
        background: rgba(15, 15, 18, 0.85);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #fff;
        cursor: pointer;
        user-select: none;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 24px;
        border-radius: 8px;
        background: linear-gradient(135deg, #ff2a4b, #ff0000);
        color: white;
        font-size: 12px;
        box-shadow: 0 0 15px var(--accent-glow);
        transition: var(--transition);
      }
      .brand:hover .brand-mark { transform: scale(1.08); }

      .search-form {
        display: flex;
        flex: 1;
        max-width: 640px;
        position: relative;
      }
      .search-form input {
        width: 100%;
        height: 44px;
        padding: 0 18px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--line);
        border-right: none;
        border-radius: 24px 0 0 24px;
        outline: none;
        transition: var(--transition);
      }
      .search-form input:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .search-form button {
        width: 60px;
        border: 1px solid var(--line);
        border-radius: 0 24px 24px 0;
        background: var(--surface-2);
        color: var(--muted);
        transition: var(--transition);
      }
      .search-form button:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }

      .header-action {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        color: var(--text);
        background: var(--surface);
        transition: var(--transition);
      }
      .header-action:hover { background: var(--surface-hover); transform: rotate(15deg); }

      /* --- MAIN CONTENT --- */
      main { width: min(1550px, calc(100% - 48px)); margin: 0 auto; padding-top: 28px; }
      
      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      h1 { margin: 0; font-size: clamp(24px, 3vw, 36px); font-weight: 800; letter-spacing: -1px; }
      .hero p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
      .result-count { color: var(--muted); font-size: 14px; font-weight: 500; }

      /* --- CATEGORIES --- */
      .categories {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 20px;
        scrollbar-width: none;
      }
      .categories::-webkit-scrollbar { display: none; }
      .category {
        flex: 0 0 auto;
        padding: 9px 18px;
        border: 1px solid var(--line);
        border-radius: 24px;
        color: var(--text);
        background: var(--surface);
        font-size: 14px;
        font-weight: 500;
        transition: var(--transition);
      }
      .category:hover { background: var(--surface-hover); border-color: rgba(255, 255, 255, 0.2); }
      .category.active {
        border-color: var(--accent);
        color: white;
        background: var(--accent);
        box-shadow: 0 4px 15px var(--accent-glow);
      }

      /* --- VIDEO GRID & CARDS --- */
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 28px 20px;
      }
      .video-card {
        min-width: 0;
        border-radius: var(--radius);
        cursor: pointer;
        animation: fadeInUp 0.4s ease forwards;
        transition: var(--transition);
      }
      .video-card:hover { transform: translateY(-6px); }

      .thumbnail-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: var(--radius);
        background: var(--surface-2);
      }
      .thumbnail-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }
      .video-card:hover .thumbnail-wrap img { transform: scale(1.05); }

      .duration {
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 4px 8px;
        border-radius: 6px;
        color: white;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        font-size: 12px;
        font-weight: 600;
      }

      .play-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: white;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(2px);
        opacity: 0;
        transition: var(--transition);
        font-size: 36px;
      }
      .video-card:hover .play-overlay { opacity: 1; }

      .video-info { display: flex; gap: 12px; padding: 12px 4px 0; }
      .channel-avatar {
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        font-weight: 700;
        font-size: 15px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      }
      .video-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 0 0 6px;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .video-meta { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }

      /* --- EMPTY STATE & ANIMATIONS --- */
      .empty {
        display: none;
        padding: 80px 20px;
        color: var(--muted);
        text-align: center;
      }
      .empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 22px; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* --- BOTTOM NAV --- */
      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 100;
        display: flex;
        justify-content: center;
        gap: 40px;
        padding: 10px 20px;
        background: rgba(24, 24, 28, 0.9);
        border-top: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }
      .nav-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 16px;
        border-radius: 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        transition: var(--transition);
      }
      .nav-button span { font-size: 20px; }
      .nav-button:hover, .nav-button.active { color: var(--accent); background: var(--accent-soft); }

      /* --- MODAL / PLAYER --- */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        animation: fadeIn 0.2s ease;
      }
      .modal.open { display: flex; }
      .player-panel {
        width: min(1000px, 100%);
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
      .player-top { display: flex; justify-content: flex-end; padding: 12px 16px; }
      .close-button {
        width: 36px; height: 36px;
        border-radius: 50%;
        color: var(--text); background: var(--surface-2);
        font-size: 20px;
        transition: var(--transition);
      }
      .close-button:hover { background: var(--accent); color: white; }
      .player-frame { aspect-ratio: 16 / 9; background: #000; }
      .player-frame iframe { width: 100%; height: 100%; border: 0; }
      .player-details { padding: 20px 24px 28px; }
      .player-details h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
      .player-details p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
      .player-actions { display: flex; flex-wrap: wrap; gap: 12px; }
      .player-actions button, .player-actions a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 24px;
        color: var(--text);
        background: var(--surface-2);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: var(--transition);
      }
      .player-actions button:hover, .player-actions a:hover, .player-actions .selected {
        border-color: var(--accent);
        color: white;
        background: var(--accent);
      }

      @media (max-width: 650px) {
        header { padding: 10px 16px; }
        main { width: calc(100% - 24px); padding-top: 16px; }
        .hero { flex-direction: column; align-items: flex-start; gap: 8px; }
        .video-grid { grid-template-columns: 1fr; gap: 20px; }
        .bottom-nav { gap: 10px; justify-content: space-around; }
      }
    </style>
  </head>

        </div>
        <form class="search-form" id="searchForm" role="search">
          <input id="searchInput" type="search" placeholder="100+ video içinden ara veya keşfet..." aria-label="Video ara" />
          <button type="submit" aria-label="Ara">🔍</button>
        </form>
        <button class="header-action" id="randomizeBtn" type="button" title="Videoları Yeniden Karıştır">🎲</button>
      </header>

      <main>
        <section class="hero">

        </section>

        <nav class="categories" id="categories" aria-label="Video kategorileri"></nav>

        <section class="empty" id="emptyState">
          <strong>Aramana uygun video bulunamadı 🔍</strong>
          Farklı bir kelime deneyebilir veya kategorileri değiştirebilirsin.
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Alt menü">
        <button class="nav-button active" id="homeButton" type="button"><span>🏠</span>Ana Sayfa</button>
        <button class="nav-button" id="favoritesButton" type="button"><span>❤️</span>Favoriler</button>
        <button class="nav-button" id="historyButton" type="button"><span>🕒</span>Geçmiş</button>
      </nav>
    </div>

    <!-- PLAYER MODAL -->
    <div class="modal" id="videoModal" role="dialog" aria-modal="true">

            <a id="youtubeButton" target="_blank" rel="noopener noreferrer">YouTube'da İzle</a>

        </div>

      // DOM Elemanları
      const grid = document.querySelector("#videoGrid");
      const emptyState = document.querySelector("#emptyState");
      const resultCount = document.querySelector("#resultCount");
      const categoriesEl = document.querySelector("#categories");
      const searchInput = document.querySelector("#searchInput");
      const modal = document.querySelector("#videoModal");
      const playerFrame = document.querySelector("#playerFrame");
      const favoriteButton = document.querySelector("#favoriteButton");

      // Dizi Karıştırma Algoritması (Fisher-Yates Shuffle)
      function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      // Depolama Yardımcıları
      function getStored(key) {
        try { return JSON.parse(localStorage.getItem(key) || "[]"); }
        catch (_) { return []; }
      }
      function setStored(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
      }
      function isFavorite(id) { return getStored("youtune-favorites").includes(id); }

      // Filtreleme & Arama Mantığı
      function filteredVideos() {
        const term = searchTerm.trim().toLocaleLowerCase("tr-TR");
        return videos.filter((video) => {
          const categoryMatch = activeCategory === "Tümü" || video.category === activeCategory;
          const text = `${video.title} ${video.channel} ${video.category}`.toLocaleLowerCase("tr-TR");
          const searchMatch = !term || text.includes(term);
          
          let modeMatch = true;
          if (mode === "favorites") modeMatch = isFavorite(video.id);
          if (mode === "history") modeMatch = getStored("youtune-history").includes(video.id);

          return categoryMatch && searchMatch && modeMatch;
        });
      }

      // Kategori Butonlarını Çiz
      function renderCategories() {
        categoriesEl.innerHTML = categories.map((cat) => `
          <button class="category ${activeCategory === cat ? "active" : ""}" type="button" data-category="${cat}">
            ${cat}
          </button>
        `).join("");
      }

      // Videoları Ekrana Çiz
      function renderVideos() {
        const list = filteredVideos();
        resultCount.textContent = `${list.length} video gösteriliyor`;
        emptyState.style.display = list.length ? "none" : "block";

        grid.innerHTML = list.map((video, index) => `
          <article class="video-card" style="animation-delay: ${Math.min(index * 0.03, 0.6)}s" tabindex="0" role="button" data-video-id="${video.id}">
            <div class="thumbnail-wrap">
              <img src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}" loading="lazy" />
              <span class="play-overlay">▶</span>
              <span class="duration">${video.duration}</span>
            </div>
            <div class="video-info">
              <div class="channel-avatar">${video.channel.charAt(0)}</div>
              <div class="video-copy">
                <h2 class="video-title">${video.title}</h2>
                <p class="video-meta">${video.channel}<br>${video.views} görüntüleme • ${video.age}</p>
              </div>
            </div>
          </article>
        `).join("");
      }

      // Video Oynatıcıyı Aç
      function openVideo(id) {
        activeVideo = videos.find((v) => v.id === id);
        if (!activeVideo) return;

        // Geçmişe Ekle
        const history = getStored("youtune-history").filter((item) => item !== id);
        setStored("youtune-history", [id, ...history].slice(0, 50));

        document.querySelector("#playerTitle").textContent = activeVideo.title;
        document.querySelector("#playerMeta").textContent = `${activeVideo.channel} • ${activeVideo.views} • ${activeVideo.age}`;
        document.querySelector("#youtubeButton").href = `https://www.youtube.com/watch?v=${id}`;
        
        updateFavoriteBtn();

        playerFrame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0"
          title="${activeVideo.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        
        modal.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeVideo() {
        modal.classList.remove("open");
        playerFrame.innerHTML = "";
        document.body.style.overflow = "";
        activeVideo = null;
      }

      function updateFavoriteBtn() {
        if (!activeVideo) return;
        const fav = isFavorite(activeVideo.id);
        favoriteButton.textContent = fav ? "❤️ Favorilerden Cıkar" : "🤍 Favorilere Ekle";
        favoriteButton.classList.toggle("selected", fav);
      }

      function setMode(nextMode) {
        mode = nextMode;
        document.querySelectorAll(".nav-button").forEach((b) => b.classList.remove("active"));
        document.querySelector(`#${nextMode}Button`).classList.add("active");
        
        const titles = { home: "Keşfet", favorites: "Favorilerim", history: "İzleme Geçmişim" };
        document.querySelector("#pageTitle").textContent = titles[nextMode];
        renderVideos();
      }

      // --- OLAY DİNLEYİCİLERİ ---

      // Arama Formu
      document.querySelector("#searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        searchTerm = searchInput.value;
        mode = "home";
        document.querySelector("#pageTitle").textContent = searchTerm ? `"${searchTerm}" Arama Sonuçları` : "Keşfet";
        renderVideos();
      });

      // Kategoriler Tıklama
      categoriesEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-category]");
        if (!btn) return;
        activeCategory = btn.dataset.category;
        renderCategories();
        renderVideos();
      });

      // Video Kartına Tıklama
      grid.addEventListener("click", (e) => {
        const card = e.target.closest("[data-video-id]");
        if (card) openVideo(card.dataset.videoId);
      });

      // Kapatma İşlemleri
      document.querySelector("#closeModal").addEventListener("click", closeVideo);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeVideo(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("open")) closeVideo(); });

      // Favorilere Ekle/Çıkar
      favoriteButton.addEventListener("click", () => {
        if (!activeVideo) return;
        const favs = getStored("youtune-favorites");
        const next = isFavorite(activeVideo.id) ? favs.filter((id) => id !== activeVideo.id) : [activeVideo.id, ...favs];
        setStored("youtune-favorites", next);
        updateFavoriteBtn();
        if (mode === "favorites") renderVideos();
      });

      // Paylaş
      document.querySelector("#shareButton").addEventListener("click", async () => {
        if (!activeVideo) return;
        const url = `https://www.youtube.com/watch?v=${activeVideo.id}`;
        if (navigator.share) await navigator.share({ title: activeVideo.title, url });
        else { await navigator.clipboard?.writeText(url); alert("Bağlantı panoya kopyalandı!"); }
      });

      // Alt Menü
      document.querySelector("#homeButton").addEventListener("click", () => setMode("home"));
      document.querySelector("#favoritesButton").addEventListener("click", () => setMode("favorites"));
      document.querySelector("#historyButton").addEventListener("click", () => setMode("history"));

      // Zar Butonu (Yeniden Karıştır)
      document.querySelector("#randomizeBtn").addEventListener("click", () => {
        videos = shuffleArray(videoDatabase);
        renderVideos();
      });

      // Logo Tıklama
      document.querySelector("#brandBtn").addEventListener("click", () => {
        searchTerm = "";
        searchInput.value = "";
        activeCategory = "Tümü";
        videos = shuffleArray(videoDatabase);
        renderCategories();
        setMode("home");
      });

      // --- BAŞLANGIÇ (INIT) ---
      function init() {
        videos = shuffleArray(videoDatabase); // Sayfa her açıldığında rastgele 100+ video
        categories = ["Tümü", ...new Set(videoDatabase.map((v) => v.category))];
        renderCategories();
        renderVideos();
      }

      init();
    </script>
  </body>
</html>
