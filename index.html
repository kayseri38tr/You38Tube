<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTune Arama</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f1e9;
      --fg: #1a2f36;
      --primary: #e85d2c;
      --card: #faf8f4;
      --muted: #6b7c82;
      --border: #e0d9cc;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(224,217,204,0.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(224,217,204,0.45) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(232,93,44,0.12);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    h1 span { color: var(--primary); }
    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    /* Search */
    .search-box {
      display: flex;
      max-width: 640px;
      margin: 32px auto 0;
      background: white;
      border-radius: 999px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px -14px rgba(26,47,54,0.22);
      overflow: hidden;
    }
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 16px 20px 16px 48px;
      font-size: 15px;
      font-family: inherit;
      background: transparent;
    }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap::before {
      content: "🔍";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      opacity: 0.6;
    }
    .search-box button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 26px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .search-box button:hover { background: #d14e22; }
    .search-box button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .examples button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: 0.15s;
    }
    .examples button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Results */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 40px 0 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 0.25s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px -20px rgba(26,47,54,0.25);
    }
    .thumb {
      aspect-ratio: 16/9;
      background: #ddd;
      position: relative;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.4s;
    }
    .card:hover .thumb img { transform: scale(1.04); }
    .duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.8);
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card-body { padding: 14px; }
    .card-title {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.35;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 13px;
      color: var(--muted);
    }

    .empty, .loading, .error {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }
    .loading { color: var(--primary); }

    /* Player modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: white;
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .modal-header strong {
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .modal-header button {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
    }
    .player-frame {
      aspect-ratio: 16/9;
      background: #000;
    }
    .player-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">● AÇIK VİDEO KEŞFİ</div>
      <h1>İzlemek istediğin<br><span>şeyi bul.</span></h1>
      <p class="subtitle">YouTube’un açık dünyasında hızlıca gezin.<br>Hesap açmadan, dikkatini dağıtmadan.</p>
    </header>

    <div class="search-box">
      <div class="search-wrap">
        <input id="q" type="text" placeholder="Bir konu, kanal ya da video ara" 
               onkeydown="if(event.key==='Enter') search()" />
      </div>
      <button id="btn" onclick="search()">Ara →</button>
    </div>

    <div class="examples">
      <span>ÖRNEKLER</span>
      <button onclick="quick('istanbul yürüyüşleri')">istanbul yürüyüşleri</button>
      <button onclick="quick('Türkçe caz')">Türkçe caz</button>
      <button onclick="quick('kahve demleme')">kahve demleme</button>
    </div>

    <div class="results-header">
      <span id="count">Arama yapın</span>
      <span>Açık ve güvenilir</span>
    </div>

    <div id="grid" class="grid"></div>
    <div id="status" class="empty">Bir şeyler ara...</div>
  </div>

  <!-- Player -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <strong id="modalTitle">Video</strong>
        <button onclick="closePlayer()">×</button>
      </div>
      <div class="player-frame">
        <iframe id="frame" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    // Senin Replit backend'in
    const API = "https://compatible-indelible-webportal--boshsjs.replit.app/api/youtube/search";

    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const count = document.getElementById("count");
    const btn = document.getElementById("btn");

    function quick(text) {
      document.getElementById("q").value = text;
      search();
    }

    async function search() {
      const query = document.getElementById("q").value.trim();
      if (query.length < 2) {
        status.textContent = "En az 2 karakter yaz.";
        status.className = "empty";
        grid.innerHTML = "";
        count.textContent = "Arama yapın";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Aranıyor...";
      status.textContent = "Aranıyor...";
      status.className = "loading";
      grid.innerHTML = "";
      count.textContent = "Yükleniyor...";

      try {
        const res = await fetch(`\( {API}?q= \){encodeURIComponent(query)}`);
        if (!res.ok) throw new Error("Sunucu hatası: " + res.status);

        const data = await res.json();
        const results = data.results || [];

        if (results.length === 0) {
          status.textContent = "Sonuç bulunamadı.";
          status.className = "empty";
          count.textContent = "0 sonuç";
        } else {
          status.textContent = "";
          status.className = "";
          count.textContent = results.length + " sonuç";
          render(results);
        }
      } catch (err) {
        console.error(err);
        status.innerHTML = `
          Arama yapılamadı.<br>
          <small style="opacity:0.7">CORS veya sunucu hatası olabilir.<br>
          Bu HTML dosyasını kendi Replit domain’inde açmayı dene.</small>
        `;
        status.className = "error";
        count.textContent = "Hata";
      } finally {
        btn.disabled = false;
        btn.textContent = "Ara →";
      }
    }

    function render(list) {
      grid.innerHTML = list.map(v => `
        <div class="card" onclick="play('\( {v.id}', \` \){(v.title || '').replace(/`/g, "'")}\`)">
          <div class="thumb">
            <img src="${v.thumbnail || ''}" alt="" 
                 onerror="this.src='https://via.placeholder.com/480x270?text=Video'">
            \( {v.duration ? `<span class="duration"> \){v.duration}</span>` : ''}
          </div>
          <div class="card-body">
            <div class="card-title">${v.title || 'Başlıksız'}</div>
            <div class="card-meta">
              ${v.channel || ''} 
              ${v.views ? ' · ' + v.views : ''}
              ${v.publishedAt ? ' · ' + v.publishedAt : ''}
            </div>
          </div>
        </div>
      `).join("");
    }

    function play(id, title) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("frame").src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      document.getElementById("modal").classList.add("open");
    }

    function closePlayer() {
      document.getElementById("modal").classList.remove("open");
      document.getElementById("frame").src = "";
    }

    // Modal dışına tıklayınca kapat
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closePlayer();
    });
  </script>
</body>
</html>
